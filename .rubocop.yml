# .rubocop.yml

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Enabled: false  

Metrics/ClassLength:
  Enabled: false  

Naming/AccessorMethodName:
  Enabled: false

# The Google News batchexecute payload is one long opaque literal that cannot be
# wrapped or interpolated without changing what gets sent.
Layout/LineLength:
  Exclude:
    - 'lib/gnews.rb'

Style/StringConcatenation:
  Exclude:
    - 'lib/gnews.rb'

# Most of Scraper's length is two lists of CSS selectors naming the furniture and the
# hidden text to leave out of an article. Wrapping them tighter to satisfy a line count
# makes them harder to read and to add to, which is the opposite of the point.
Metrics/ModuleLength:
  Exclude:
    - 'lib/scraper.rb'

Metrics/AbcSize:
  Enabled: false  

AllCops:
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'bin/**/*' 
    - 'vendor/**/*'
    - 'app/channels/**/*'
    - 'app/helpers/**/*'
    - 'app/jobs/**/*'
    - 'app/mailers/**/*'
    - 'app/models/**/*'
