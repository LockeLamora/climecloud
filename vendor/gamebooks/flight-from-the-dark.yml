sections:
  start:
    title: Flight from the Dark
    text: |-
      The first book of the Lone Wolf series. Your Combat Skill, Endurance and Gold Crowns are drawn from the Random Number Table, five Kai Disciplines are yours, and the monastery's ruins yield an Axe, a Map, a Meal and one find from the equipment list.

      Everything is tracked for you: weapons and the satchel, gold found and spent, meals eaten when the story demands one, and potions offered in green when they can help. Combat is fought a round at a time from the Combat Results Table - fighting bare-handed is harder, and the weapon your Weaponskill was learned in earns its bonus while you hold it. If your Endurance ever falls to zero, the story ends.
    choices:
    - label: Begin at section 1
      to: '1'
  '1':
    text: |-
      You must make haste for you sense it is not safe to linger by the smoking remains of the ruined monastery. The black-winged beasts could return at any moment. You must set out for the Sommlending capital of Holmgard and tell the King the terrible news of the massacre: that the whole élite of Kai warriors, save yourself, have been slaughtered. Without the Kai Lords to lead her armies, Sommerlund will be at the mercy of their ancient enemy, the Darklords.

      Fighting back tears, you bid farewell to your dead kinsmen. Silently, you promise that their deaths will be avenged. You turn away from the ruins and carefully descend the steep track.

      At the foot of the hill, the path splits into two directions, both leading into a large wood.
    choices:
    - label: If you wish to use your Kai Discipline of Sixth Sense, turn to 141.
      to: '141'
      needs: sixth sense
    - label: If you wish to take the right path into the wood, turn to 85.
      to: '85'
    - label: If you wish to follow the left track, turn to 275.
      to: '275'
    title: '1'
  '2':
    text: |-
      As you dash through the thickening trees, the shouts of the Giaks begin to fade behind you. You have nearly outdistanced them completely, when you crash headlong into a tangle of low branches.

      Pick a number from the Random Number Table.
