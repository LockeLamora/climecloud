    title: '8'
  '9':
    text: 'You cannot move: you are being held rigid by some powerful force. Your
      eyes are drawn towards the mouth of the skeleton. From deep in the earth you
      hear a low humming, like the sound of millions of angry bees. A dull red glow
      appears in the empty eye sockets of the dead King and the humming increases
      until your ears are filled with the deafening roar. You are in the presence
      of an ancient evil, far older and stronger than the Darklords themselves.'
    choices:
    - label: If you possess a Vordak Gem, turn to 236.
      to: '236'
