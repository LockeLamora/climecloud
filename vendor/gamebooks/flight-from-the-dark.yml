disciplines:
  camouflage:
    name: Camouflage
    about: This Discipline enables a Kai Lord to blend in with his surroundings. In
      the countryside, he can hide undetected among trees and rocks and pass close
      to an enemy without being seen.
  hunting:
    name: Hunting
    about: This skill ensures that a Kai Lord will never starve in the wild. He will
      always be able to hunt for food for himself except in areas of wasteland and
      desert. The skill also enables a Kai Lord to be able to move stealthily when
      stalking his prey.
    effect: 'Hunting: no need for a Meal when instructed to eat'
  sixth sense:
    name: Sixth Sense
    about: This skill may warn a Kai Lord of imminent danger. It may also reveal the
      true purpose of a stranger or strange object encountered in your adventure.
  tracking:
    name: Tracking
    about: This skill enables a Kai Lord to make the correct choice of a path in the
      wild, to discover the location of a person or object in a town or city and to
      read the secrets of footprints or tracks.
  healing:
    name: Healing
    about: This Discipline can be used to restore ENDURANCE points lost in combat.
      If you possess this skill you may restore 1 ENDURANCE point to your total for
      every numbered section of the book you pass through in which you are not involved
      in combat.
    effect: 'Healing: +1 ENDURANCE point for each section without combat'
  weaponskill:
    name: Weaponskill
    about: Upon entering the Kai Monastery, each initiate is taught to master one
      type of weapon.
  mindshield:
    name: Mindshield
    about: The Darklords and many of the evil creatures in their command have the
      ability to attack you using their Mindforce. The Kai Discipline of Mindshield
      prevents you from losing any ENDURANCE points when subjected to this form of
      attack.
    effect: 'Mindshield: no points lost when attacked by Mindblast'
  mindblast:
    name: Mindblast
    about: This enables a Kai Lord to attack an enemy using the force of his mind.
      It can be used at the same time as normal combat weapons and adds two extra
      points to your COMBAT SKILL. Not all the creatures encountered on this adventure
      will be harmed by Mindblast.
    effect: 'Mindblast: +2 COMBAT SKILL points'
  animal kinship:
    name: Animal Kinship
    about: This skill enables a Kai Lord to communicate with some animals and to be
      able to guess the intentions of others.
  mind over matter:
    name: Mind Over Matter
    about: Mastery of this Discipline enables a Kai Lord to move small objects with
      his powers of concentration.
