  '17':
    title: Page 17
    text: |-
      At the corner of the road, John sat down on a mile-stone. "That way?" he suggested.

      "No, that way," said Jennifer, pointing in the opposite direction. Then she saw a shepherd, carrying a crook and making his way up the path to the oast-houses. "Let's ask him," she cried.

      The man stopped as they came running up to him; he looked puzzled at John's question, "Please, could you tell us the way to the treasure?"

      "Well," he said thoughtfully, "there's the Treasure Tea Rooms at Little Castleton." He waved his stick towards the road on their left. "Or," he said, "there's the game of Hunt the Treasure that the folk play round about Christmas-time at the Treasure Inn on the other side of the river; but then the 'treasure' is only a fat goose. Is that what you mean?" He pointed to the right-hand road, which ran over a bridge.

      "Thank you, but we mean real treasure," cried both children.

      As they turned away, John said, "I don't care if none of these people ever heard of the treasure. They name everything after it and play games about treasures, and don't even know why. It makes me think there really is treasure to be found, after all. So let's be on our way."

      (Yes, but which way? See the opposite page and decide.)

      * (A pair of THRUSHES sang to the children just here. Where are the birds hiding?)
