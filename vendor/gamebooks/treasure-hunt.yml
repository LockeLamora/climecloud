  '24':
    title: Page 24
    text: |-
      When they reached the first fork in the road, John put the map in his pocket. "Now that I've studied it, I think I can find the way back to Peacock Corner without looking at the map every minute," he boasted.

      They did find their way home—though not so easily as they expected.

      "You are late for tea," cried their mother as they came in. "Be quick and wash your hands. Daddy is taking us all to the cinema to see ' Hidden Treasure '; quite a lot of the scenes were taken near an old castle somewhere in this part of the country."

      John and Jennifer looked at each other.

      "That seems to explain away our treasure-chest," said John ruefully.

      "Never mind," said Jennifer, "it was great fun hunting for it—and seeing the film will be almost as exciting as finding the real treasure ourselves."
