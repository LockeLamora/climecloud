  '20':
    title: Page 20
    text: |-
      As they scrambled over the stile and started along the path by the side of the stream, John pointed to the line of trees across the water. "When we get on the other side of those," he said, "you'll see how clever I was to come this way."

      He led the way over the wooden foot-bridge, which was quite strong enough for the children's light weight, and up the slope of the meadow, where the path ran into the strip of woodland. Soon, it widened out into a small clearing, which ended in a fence with a squeezer leading on to the side of a road.

      Jennifer threw herself down on the mossy ground, and John followed suit. "Don't go to sleep, lazybones!" murmured Jennifer, tickling his nose with a blade of grass.

      After a brief rest, they went out to the edge of the road and looked both ways. To the left led past the church they had seen from the other side of the river; to the right, the road ran into a wider thoroughfare above which stood two oast-houses.

      "Go ri-ight! Go ri-ight!" shrilled a blackbird overhead. "Left-left-left-left!" whispered the grasshoppers in the clearing.

      (Which advice would you have taken?)

      * (A SQUIRREL lives in this copse. Can you spot him?)
