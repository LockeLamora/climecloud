  '18':
    title: Page 18
    text: |-
      Not a word did they say as they walked silently along the winding, shaded side road—not a word until suddenly they saw, straight in front of them, the towering walls and turrets of the CASTLE.

      Just for a moment they stopped and stared. "Hurrah!" cried Jennifer; "Hurrah!" cried John, as they ran excitedly under the arched gateway.

      But now that John and Jennifer had found the castle for which they had been looking, they did not go more than half-way up the path which wound up the hill towards it. That was because they saw a pit cut out of the side of the grassy slope; and in it was the entrance to a cave.

      "That's just where the treasure might be hidden," said John. So they turned aside and stepped cautiously through the dark entrance.

      They stood still until their eyes became accustomed to the faint light—and it was then they saw a great big chest. Together they pushed up the heavy lid and looked eagerly inside.

      "The TREASURE!" they both cried at once. For here were masses of shining jewels and golden coins and all sorts of glittering things. The big chest was filled to the brim with treasures. What were they to do with their treasure-chest now that they had found it? That was going to be a difficult question.

      They stood up and looked round the cave, trying to think what they should do next, when suddenly John saw a piece of paper lying on the ground beside the chest. He picked it up and, holding it in a shaft of light, said, "Come and look at this. It's a map, and I think it's a map showing the country round about the castle itself."

      * (The children found the chest unlocked. Can you find the KEY that opened it?)
