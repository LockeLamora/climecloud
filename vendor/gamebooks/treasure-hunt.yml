  '23':
    title: Page 23
    text: |-
      "If only we'd had this map when we started out," said John, "we could have found our way here in half the time."

      "Yes," agreed Jennifer, "but it wouldn't have been nearly so exciting. What a marvellous map it is!" she added; "it shows absolutely everything—all the houses we've passed, all the landmarks we've seen, villages, mills, oast-houses, bridges and even trees!"

      John was looking puzzled. "This is only a rough sort of picture map," he said, "but it shows a railway, an aerodrome, a modern camp and a bridge that can't have been broken down very long. D'you see what that means? It means that it was drawn quite lately; and that means that someone else must have been here and found the treasure too. Let's have a look at that chest again."

      They examined their find more closely. Suddenly Jennifer spied a small tab fixed to the back of the chest. "' KINNIKOLOR COMPANY,'" she read. "That's certainly a funny way for an ancient baron to label his secret hoard," she said, "unless that was the name of his band of followers, like the ' White Company ' or the Knights of the Round Table."

      "Let's hurry home and ask Daddy about it," suggested John. "It won't take us long to find our way back with this map. And, if this ' treasure ' is treasure, we can get him to come and collect it in a car."

      So, map in hand, they hurried gaily back towards the castle gateway.

      (How easily can you find your way back to Peacock Corner —even with the aid of the map?)
