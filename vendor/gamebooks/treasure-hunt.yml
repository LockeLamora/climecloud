  '21':
    title: Page 21
    text: |-
      As they breasted the rise which led to the little old church, the children were able to see over the high wall on their right. It was evidently the wall of the castle grounds; for there, in the distance, were the turrets of the castle itself.

      "We can't go far wrong now," said John. But, when they had passed the brow of the hill, they found that the road wound round to the left. There were tents in a field on their left, and soldiers drilling.

      "Oh dear! Wrong again!" cried Jennifer. "Still, we might as well look at the soldiers."

      The road wound right round the camp and finished up at a bridge over a broad stream. At least it was a bridge that had once gone over the stream; now, most of it was under the water.

      "Look!" cried John; "the road goes round to the right again—just the way we want to go, if only we could get across."

      On a corner of the broken bridge, on the opposite side of the stream, sat a fisherman, who had just hooked a silvery carp. When he heard John, he looked up and called out, "You had better not try to swim across, unless you want a free trip to the seaside; the current here is as strong as a horse."

      "A sea-horse, I suppose!" shouted John.

      "No, a wet-clothes-horse!" laughed the fisherman. "Anyhow, it will be Shanks's pony for you two, because you'll have to go back the way you came."

      * (Grazing in one of the meadows is a... Well, that's what YOU will be if you can't find him!)
