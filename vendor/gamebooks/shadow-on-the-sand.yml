    text: 'The guard begins to cough. He pleads with you to slacken your grip or he
      will choke to death. You ask him one more question: does he know where your
      confiscated equipment is? He says he does not know. Then, suddenly, he elbows
      you in the chest and breaks free. You are winded, but you are determined to
      stop him from escaping.'
