  newskill:
    title: A New Kai Discipline
    text: Every adventure you survive raises your rank in the Kai, and with rank comes
      further training. Choose one more Kai Discipline to master before you set out.
    offers:
    - item: camouflage
      spends: discipline choice
      label: Camouflage
      about: This Discipline enables a Kai Lord to blend in with his surroundings.
        In the countryside, he can hide undetected among trees and rocks and pass
        close to an enemy without being seen.
    - item: hunting
      spends: discipline choice
      label: Hunting
      about: This skill ensures that a Kai Lord will never starve in the wild. He
        will always be able to hunt for food for himself except in areas of wasteland
        and desert.
    - item: sixth sense
      spends: discipline choice
      label: Sixth Sense
      about: This skill may warn a Kai Lord of imminent danger. It may also reveal
        the true purpose of a stranger or strange object encountered in your adventure.
    - item: tracking
      spends: discipline choice
      label: Tracking
      about: This skill enables a Kai Lord to make the correct choice of a path in
        the wild, to discover the location of a person or object in a town or city
        and to read the secrets of footprints or tracks.
    - item: healing
      spends: discipline choice
      label: Healing
      about: This Discipline can be used to restore ENDURANCE points lost in combat.
        If you possess this skill you may restore 1 ENDURANCE point to your total
        for every numbered section of the book you pass through in which you are not
        involved in combat.
    - item: mindshield
      spends: discipline choice
      label: Mindshield
      about: The Darklords and many of the evil creatures in their command have the
        ability to attack you using their Mindforce. The Kai Discipline of Mindshield
        prevents you from losing any ENDURANCE points when subjected to this form
        of attack.
    - item: mindblast
      spends: discipline choice
      label: Mindblast
      about: This enables a Kai Lord to attack an enemy using the force of his mind.
        It can be used at the same time as normal combat weapons and adds two extra
        points to your COMBAT SKILL. Not all the creatures encountered on this adventure
        will be harmed by Mindblast.
    - item: animal kinship
      spends: discipline choice
      label: Animal Kinship
      about: This skill enables a Kai Lord to communicate with some animals and to
        be able to guess the intentions of others.
    - item: mind over matter
      spends: discipline choice
      label: Mind Over Matter
      about: Mastery of this Discipline enables a Kai Lord to move small objects with
        his powers of concentration.
