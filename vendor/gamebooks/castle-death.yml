  '24':
    text: 'After what seems like an hour, but in reality is only a few minutes at
      the most, the scorching heat subsides and the tunnel air becomes painless to
      breathe. You press on and soon arrive at an archway, where the shiny steel tube
      enters a chamber gouged out of solid black iron. There a spiral staircase ascends
      to a portal. You climb the stairs and peer out through the portal. A sight greets
      you that sets your pulse racing. Before you stands a gleaming block of solid
      gold—the back of Lord Zahda’s throne. Above it, hovering motionless in the air,
      are two perfect crystals: one glows darkly with black fire; the other radiates
      a pure golden light that sends a shiver down your spine. It is the object of
      your quest—the Lorestone of Herdos.'
