story: |-
  Lone Wolf is the last of the Kai, and has sworn to raise the order from the ashes
  of the massacre that destroyed it. The Book of the Magnakai holds the way, but its
  deeper skills cannot be learned from the page alone: they are locked in the seven
  Lorestones of Nyxator, which Sun Eagle, the first Kai, gathered a thousand years
  ago. Only three of the ten Magnakai Disciplines have yielded to study so far.

  The first Lorestone was found in the crypt of a cathedral in war-torn Tekaro, and
  as its power passed into him Lone Wolf saw where the second lay: Herdos, on the
  shore of Lake Khor, high in the mountains of Dessi.

  In the Tower of Truth at Elzian, Rimoah of the Elder Magi shows him the place in a
  dais of liquid metal - a black fortress on an island in a moonlit lake. The Elder
  Magi will carry him to its shore, but no further; their power has only ever been
  enough to pen the evil that has grown there, never to end it. Braver warriors than
  most have gone in at their asking, and none has come out. In the tongue of
  Sommerlund the fortress of Kazan-Oud has a shorter name: Castle Death.
