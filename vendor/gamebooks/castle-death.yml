    name: Huntmastery
    about: This skill ensures that a Kai Master will never starve in the wild; he
      will always be able to hunt for food, even in areas of wasteland and desert.
      It also enables a Kai Master to move with great speed and dexterity and will
      allow him to ignore any extra loss of COMBAT SKILL points due to a surprise
      attack.
    effect: 'Huntmastery: no need for a Meal when instructed to eat'
  pathsmanship:
    name: Pathsmanship
    about: In addition to recognizing the correct path in unknown territory, Pathsmanship
      will enable a Kai Master to read foreign languages, decipher symbols, read footprints
      and tracks, and detect the presence of most traps.
  psi-surge:
    name: Psi-surge
    about: This psychic skill enables a Kai Master to attack an enemy using the force
      of his mind. It adds 4 extra points to your COMBAT SKILL, but for every round
      in which you use it you must deduct 2 ENDURANCE points. The weaker Mindblast
      adds only 2 and costs nothing. Psi-surge cannot be used if your ENDURANCE falls
      to 6 or below.
    effect: 'Psi-surge: +4 COMBAT SKILL points but -2 ENDURANCE points per round'
  psi-screen:
    name: Psi-screen
    about: Many hostile creatures of Magnamund can attack you using their Mindforce.
      Psi-screen prevents you from losing any ENDURANCE points when subjected to this
      form of attack and greatly increases your defence against illusions and hypnosis.
    effect: 'Psi-screen: no points lost when attacked by Mindforce'
  nexus:
    name: Nexus
    about: Mastery of this Magnakai skill will enable you to withstand extremes of
      heat and cold without losing ENDURANCE points, and to move items by your powers
      of concentration alone.
  divination:
    name: Divination
    about: This skill may warn a Kai Master of imminent or unseen danger, or enable
      him to detect an invisible or hidden enemy. It may also reveal the true purpose
      of a stranger or strange object, and allows telepathic communication.
