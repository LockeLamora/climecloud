  '344':
    text: |-
      The hideous creature gurgles with anger and springs forward to attack.

      It is immune to Psi-surge and Mindblast.
    choices:
    - label: If you reduce its ENDURANCE to 25 or less, do not continue combat but
        instead turn to 310.
      to: '310'
    combat:
      enemies:
      - name: Dakomyd
        skill: 25
        endurance: 50
      immune:
      - mindblast
      - psi-surge
      faltering:
        at_most: 25
        to: '310'
    title: '344'
  '345':
    text: The man delights in showing you his work, which is excellent. Many of his
      exhibits were caught on hunting expeditions, either by himself or by clients
      who wished to preserve their kills as trophies—several trophies have been expertly
      restored to cover the evidence of wounds or severed limbs. He offers to show
      you his workshop where these miracles of taxidermy are carried out.
    choices:
    - label: If you wish to see the taxidermist’s workshop, turn to 213.
      to: '213'
    - label: If you wish to decline his generous offer and leave the shop, turn to
        149.
      to: '149'
    title: '345'
  '346':
    text: Seated near to the fireplace are three surly-faced drinkers, their tunics
      stained with the grime of travel. Each wears a red badge upon their breast,
      embroidered with the crossed swords of Varetta. You sense that they are soldiers-of-fortune,
      probably in the pay of a captain who comes from the same city.
    choices:
    - label: If you wish to join the men and perhaps find out more about Varetta,
        turn to 125.
      to: '125'
    - label: If you decide not to approach them and wish to go to the bar and ask
        about a room for the night, turn to 232.
      to: '232'
    - label: If you would rather take a seat and order some food, turn to 172.
      to: '172'
    title: '346'
  '347':
    text: |-
      Your betting has attracted some unwanted attention. Two shifty-eyed mercenaries have been watching you with more than casual interest since your arrival at the Inn of the Crossed Swords, and as the event ends and the crowds disperse, you suddenly feel the sharp point of a dagger piercing the back of your tunic.

      ‘Your purse or your life,’ whispers one of the men, his foul breath filling your nostrils. ‘Make your choice.’
    choices:
    - label: If you have the Magnakai Discipline of Huntmastery, turn to 114.
      to: '114'
      needs: huntmastery
    - label: If you wish to hand over all your Gold Crowns without offering any resistance,
        turn to 161.
      to: '161'
    - label: If you decide to refuse the men their demand and wish to fight to keep
        your gold, turn to 282.
      to: '282'
    title: '347'
  '348':
    text: You manoeuvre the noose until it catches on the spur at the back of the
      hammer’s head and lift it gently from the corpse’s chest. Unfortunately, the
      rope is not secure, and the warhammer slips from the noose as you pull it upwards.
      With a dull splash, the weapon lands in one of the black puddles and sinks from
      sight. Disappointed by such a stroke of bad luck, you retrieve your Rope and
      coil it back into your Backpack before returning to Cyrilus.
    choices:
    - label: Turn to 338.
      to: '338'
    title: '348'
  '349':
    text: |-
      You part the strands and step into the small vault beyond, but you have barely set one foot down before you sense that something is wrong. The floor feels soft and spongy, and the strands are now coiling themselves around your shoulders. You have stepped into the spawning chamber of a Dakomyd.

      As the acid secreted by the larvae eats through your clothes and sears your flesh, you hear the distant mocking laughter of the Dakomyd mother.

      Your life and your quest end here.
    choices: []
    title: '349'
  '350':
    text: |-
      Before your eyes the Dakomyd’s skin ripples as if a wave were washing beneath its skin. Suddenly a criss-cross of wrinkles appears, and layers of transparent bone peel and fall from its shell-like skull. Its body becomes hunched, shrinking and folding by the second, until all that is left is a film of dust on the floor of the crypt. Time has at last caught up with this ancient terror.

      As the golden light begins to fade, you stare at the object of your quest—the Lorestone of Varetta. But all that you hold in your hand is a hollow sphere of glass, transparent and unremarkable to look at.

      Your quest has succeeded, for the power of the Lorestone has been transfused into your body and mind. Its strength and wisdom is now a part of you, and the transfusion signals the beginning of a new and deadly challenge on your quest for the Magnakai.

      But be warned! The quest will draw you into a sinister realm where a malicious and terrible evil has grown in power since Sun Eagle first completed the Magnakai quest. If you possess the courage of a true Kai Master, the challenge and the quest await you in Book 7 of the Lone Wolf series entitled:

      Castle Death
    choices: []
    title: '350'
  newskill:
    title: The Magnakai Disciplines
    text: Having studied The Book of the Magnakai you have reached the rank of Kai
      Master Superior, which means you have learnt three of the Magnakai Disciplines.
      It is up to you to choose which three these are. As all of them may be of use
      to you at some point on your adventure, pick your three with care.
    offers:
    - item: animal control
      spends: magnakai choice
      label: Animal Control
      about: This Magnakai Discipline enables a Kai Master to communicate with most
        animals and to determine their purpose and intentions. It also enables a Kai
        Master to fight from the saddle with great advantage.
    - item: curing
      spends: magnakai choice
      label: Curing
      about: The possessor of this skill can restore 1 lost ENDURANCE point to his
        total for every numbered section of the book through which he passes, provided
        he is not involved in combat. This Magnakai Discipline also enables a Kai
        Master to cure disease, blindness, and any combat wounds sustained by others,
        as well as himself.
    - item: invisibility
      spends: magnakai choice
      label: Invisibility
      about: This Magnakai skill allows a Kai Master to blend in with his surroundings,
        even in the most exposed terrain. It will enable him to mask his body heat
        and scent, and to adopt the dialect and mannerisms of any town or city that
        he visits.
    - item: huntmastery
      spends: magnakai choice
      label: Huntmastery
      about: This skill ensures that a Kai Master will never starve in the wild; he
        will always be able to hunt for food, even in areas of wasteland and desert.
        It also enables a Kai Master to move with great speed and dexterity and will
        allow him to ignore any extra loss of COMBAT SKILL points due to a surprise
        attack.
    - item: pathsmanship
      spends: magnakai choice
      label: Pathsmanship
      about: In addition to recognizing the correct path in unknown territory, Pathsmanship
        will enable a Kai Master to read foreign languages, decipher symbols, read
        footprints and tracks, and detect the presence of most traps.
    - item: psi-surge
      spends: magnakai choice
      label: Psi-surge
      about: This psychic skill enables a Kai Master to attack an enemy using the
        force of his mind. It adds 4 extra points to your COMBAT SKILL, but for every
        round in which you use it you must deduct 2 ENDURANCE points. The weaker Mindblast
        adds only 2 and costs nothing. Psi-surge cannot be used if your ENDURANCE
        falls to 6 or below.
    - item: psi-screen
      spends: magnakai choice
      label: Psi-screen
      about: Many hostile creatures of Magnamund can attack you using their Mindforce.
        Psi-screen prevents you from losing any ENDURANCE points when subjected to
        this form of attack and greatly increases your defence against illusions and
        hypnosis.
    - item: nexus
      spends: magnakai choice
      label: Nexus
      about: Mastery of this Magnakai skill will enable you to withstand extremes
        of heat and cold without losing ENDURANCE points, and to move items by your
        powers of concentration alone.
    - item: divination
      spends: magnakai choice
      label: Divination
      about: This skill may warn a Kai Master of imminent or unseen danger, or enable
        him to detect an invisible or hidden enemy. It may also reveal the true purpose
        of a stranger or strange object, and allows telepathic communication.
    - item: weaponmastery
      spends: magnakai choice
      label: Weaponmastery
      about: This Magnakai Discipline enables a Kai Master to become proficient in
        the use of all types of weapon. When you enter combat with a weapon you have
        mastered, you add 3 points to your COMBAT SKILL. The rank of Kai Master Superior,
        with which you begin the Magnakai series, means you are skilled in three of
        the weapons.
      with_count:
        weapon choice: 3
    choices:
    - label: Choose the three weapons you have mastered
      to: weaponmaster
      needs: weapon choice
      quiet: true
    - label: Done - on to your equipment
      to: armoury
      without: magnakai choice
  weaponmaster:
    title: Weaponmastery
    text: |-
      This Magnakai Discipline enables a Kai Master to become proficient in the use of all types of weapon. When you enter combat with a weapon you have mastered, you add 3 points to your COMBAT SKILL. The rank of Kai Master Superior, with which you begin the Magnakai series, means you are skilled in three of the weapons.

      Choose the three weapons you are skilled with. You do not begin the adventure carrying them.
    offers:
    - item: weaponmastery in sword
      spends: weapon choice
      label: Skilled with the sword
    - item: weaponmastery in warhammer
      spends: weapon choice
      label: Skilled with the warhammer
    - item: weaponmastery in bow
      spends: weapon choice
      label: Skilled with the bow
    - item: weaponmastery in quarterstaff
      spends: weapon choice
      label: Skilled with the quarterstaff
    - item: weaponmastery in dagger
      spends: weapon choice
      label: Skilled with the dagger
    - item: weaponmastery in axe
      spends: weapon choice
      label: Skilled with the axe
    - item: weaponmastery in mace
      spends: weapon choice
      label: Skilled with the mace
    - item: weaponmastery in spear
      spends: weapon choice
      label: Skilled with the spear
    - item: weaponmastery in short sword
      spends: weapon choice
      label: Skilled with the short sword
    - item: weaponmastery in broadsword
      spends: weapon choice
      label: Skilled with the broadsword
    choices:
    - label: Back to the Disciplines
      to: newskill
      needs: magnakai choice
      quiet: true
    - label: On to your equipment
      to: armoury
      without: magnakai choice
  armoury:
    title: Equipment
    text: Before leaving Sommerlund on your quest for the Lorestone of Varetta you
      equip yourself with a map of the Stornlands and a pouch of gold. You can take
      five items from the list below, adding to these any you may already possess.
      Remember you can only carry two Weapons and eight Backpack Items.
    offers:
    - item: sword
      spends: armoury choice
      label: A Sword
    - item: potion
      count: 1
      spends: armoury choice
      label: A Potion of Laumspur (endurance +4)
    - item: warhammer
      spends: armoury choice
      label: A Warhammer
    - item: bow
      spends: armoury choice
      label: 'A Bow (no use hand-to-hand: carry a close weapon too)'
    - item: quiver
      spends: armoury choice
      with_count:
        arrow: 6
      label: A Quiver of six Arrows
    - item: meal
      count: 4
      spends: armoury choice
      label: Four Special Rations
    - item: quarterstaff
      spends: armoury choice
      label: A Quarterstaff
    - item: padded leather waistcoat
      spends: armoury choice
      effects:
        endurance: 2
      label: A Padded Leather Waistcoat (endurance +2)
    - item: rope
      spends: armoury choice
      label: A Rope
    - item: dagger
      spends: armoury choice
      label: A Dagger
    - item: tinderbox
      spends: armoury choice
      label: A Tinderbox
    - item: axe
      spends: armoury choice
      label: An Axe
    choices:
    - label: Choose your mastered weapons
      to: weaponmaster
      needs: weapon choice
      quiet: true
    - label: Ride south for the Stornlands
