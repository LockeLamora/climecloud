    title: '19'
  '20':
    text: Your ambush catches the enemy by surprise, making them panic and fly in
      all directions. At such close range your Arrow pierces the chainmailed chest
      of the rider holding Cyrilus’ horse and kills him instantly. (Remember to deduct
      an Arrow from your Action Chart.) As he tumbles to the ground, you break cover,
      exploding through the bushes and scooping the reins from the dead man’s horse.
      Angry shouts echo in your wake as you take off along the highway with the wizard
      and his horse by your side.
