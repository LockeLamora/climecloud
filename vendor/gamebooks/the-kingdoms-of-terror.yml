    text: The gleaming pike heads are barely inches from your chest when you unsheathe
      your weapon and smash them aside. Your blow shatters their shafts and the guards
      reel back, wide-eyed and slack-jawed with shock. Seizing your advantage, you
      spur your horse once more and gallop towards the welcoming shadows of the street
      ahead. As the outraged cries of the gatehouse guard fade away, you find yourself
      at a fork in the road. Shadows are lengthening as night draws its cloak around
      the border town, and you are anxious to find safe lodging for yourself and your
      horse.
