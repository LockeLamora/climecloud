  '14':
    text: |-
      Suddenly, the riders appear and spread out in a semicircle to surround you. ‘We have a debt to settle, Northlander,’ hisses Roark, his lips drawn back from his teeth in a contemptuous sneer. ‘I demand payment in full!’

      Madness flashes in his glaring eyes as he removes an amulet from around his neck and holds it high in the air.

      ‘Come, come Tagazin, I summon thee. From the pit of eternal pain, I summon thee!’

      The skin on your arms and neck prickles with dread at the sound of Roark’s terrible invocation, and you cast your eyes around you for an escape route. Only the churchyard offers a way past Roark and his men, but as you spur your horse through the stone gateway, you are suddenly frozen with terror by what you see before you.
    choices:
    - label: Turn to 270.
      to: '270'
    title: '14'
  '15':
    text: The town watch gasp in unison, shocked by the seemingly effortless ease
      with which you have defeated their sergeant. They hesitate and step back, anxious
      to avoid your gaze and your displeasure. Touching your horse’s flanks with your
      spurs, you move rapidly forward towards the wagons where a handful of fresh-faced
      guards scatter like frightened chickens. No one dares to challenge you as you
      manoeuvre your horse around them and canter along the winding alley ahead.
    choices:
    - label: Turn to 332.
      to: '332'
    title: '15'
  '16':
    text: 'In the dim glow of a street lantern, you unfold the Map of Varetta and
      study the complicated network of roads and alleys. Mark this as a Special Item
      on your Action Chart. Brass Street is located on the far side of the city, close
      to the west wall. Suddenly, a bell tolls, its dull clang echoing among the rooftops
      and towers. It is the curfew: everyone must be off the streets within one hour.
      You will never reach the far side of the city in an hour, so you resolve to
      find a tavern for the night and resume your quest at dawn.'
