story: |-
  Ten years have passed since the Darklords of Helgedad were driven back and the
  Kai Monastery raised from its ashes. Lone Wolf, sole survivor of the massacre of
  the Kai, is now Kai Grand Master, and the young Sommlending he has trained are
  the first new Kai warriors in a generation.

  But the Kai Disciplines alone will not hold the Darklands at bay. The deeper
  warrior skills of the Magnakai died with the Kai Masters of old, and only the
  Lorestones of Nyxator - seven gems scattered across Magnamund, each holding the
  wisdom of the Magnakai - can restore them. Without them, the order Lone Wolf has
  rebuilt will never rise beyond what he can teach it himself.

  Word reaches Sommerlund that the first Lorestone lies in the city of Varetta, in
  the Stornlands far to the south. Lone Wolf rides out to find it, alone, into
  lands where Sommerlund's name means nothing and the Darklords' agents are already
  waiting.
