  '28':
    text: As the warrior crashes to the ground, you see your travelling companion
      embroiled in a struggle with five armoured horsemen. They have him surrounded,
      and his attempts to free himself are short-lived and futile. A blow from a mace
      ends all resistance, and he falls limply across the neck of his horse. A moment
