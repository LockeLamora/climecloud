  J-12:
    title: J-12
    text: |-
      The police investigations concerning the murder of Bullen came to nothing, partly because they could find no motive for the crime. Although there was some suspicion of Jed, the final assumption was that Mr. Bullen had surprised a thief who had entered from the balcony. At least, that was the story given out, but Jed had an uneasy feeling that he was being watched after he left Antibes.

      Jed and Carol made a pretense of a united life, but they were in reality completely alienated. They dared not divorce each other lest the scandal be revealed. Vauncey dropped out of the picture. Carol and Jed got out of Europe as fast as they could, returning to Franklin, U.S.A., which they profoundly wished they had never left. The two made their home with Mrs. Harringdale, and after a few years each went off alone on long trips as often as seemed safe. They made a point of being especially loving when in public together.

      The consequence of the cloud hanging over them was not so bad as might have been expected. The family life when all three were together was not unhappy, because the two young people appreciated the refuge which Mrs. Harringdale's unconscious protection afforded them, while she, quickly sensing that they were not all in all to each other, felt no jealousy of her son's wife.
    choices: []
  J-13:
    title: J-13
    text: |-
      Jed was two hours late to his wedding because his mother was in a state! Even while the minister was making Jed and Helen man and wife his mother had a stroke which deprived her of the power of speech and motion. The wedding trip was postponed; in fact, was not taken until six years later. During those years Jed and Helen lived at Mrs. Harringdale's house, where the invalid was under the care of two nurses, but demanded constant attention from her son. She regained some powers of speech and movement, but continued bedridden. Her animosity toward Helen became spasmodic and she was devoted to her three grandchildren. Jed knew that her last years were not unhappy.

      After her death the family traveled and spent some years in France, where Jed took up sketching in an amateurish way. Upon their return they made over the house and replanted the grounds. Helen soon realized that her husband was not a business man, and on the plea of leaving him free to devote his time to painting, for which he showed unusual talent, she persuaded him to place all the business of the estate in the hands of capable lawyers.

      The consequence of Jed's disobeying his irrationally jealous mother was that everybody except the mother was moderately happy.
    choices: []
  J-14:
    title: J-14
    text: |-
      Jed's decision to give up Helen and stand by his mother was from one viewpoint admirable, while from another it was simply the result of his inability to make a decision. While he was saying to himself, "I'll wait and see what breaks," hoping against hope that in some miraculous way his mother would be reconciled to his marriage, Helen was up and off to take a job in the city.

      Jed was both broken-hearted and relieved, for the break with Helen certainly did improve his mother's disposition. His three love-affairs had gone wrong, but this did not discourage him from trying others, each briefer than the last. The older generation spoke disparagingly of him as a Don Juan, looking upon him with disapproval, while the younger generation were bored by him. No one understood the tragedy of his eternal quest for a perfect woman who would satisfy both his mother and himself.

      Jed never asked himself if there existed a perfect woman—and if so, why he deserved her. The consequence of his being a docile slave to a dominating, selfish old woman, was that he was a perfect son but no good at all as a husband.
    choices: []
  J-15:
    title: J-15
    text: |-
      Carol was a practical woman and when she saw that it was necessary for her husband to tell what had happened in order to save himself from paying the death penalty for Bullen's murder, she went on the stand and represented the dead man as a friend who had taken advantage of her innocence. The trial was much enjoyed by the press of two countries and Jed was acquitted on "the unwritten law."

      Though Carol was willing to stand by him through the trial, she followed the conventions of the tribe and sued for a divorce soon afterward. The divorce caused them some inconvenience, for it necessitated Carol's going to Reno for three months though she hated Western life.

      Vauncey, although she had not loved her husband, was so shocked and humiliated by the whole affair, that she withdrew from Jed's life entirely. Jed returned to Franklin, but the cloud on his reputation cut him off from his old friends, even though they tried to be kind. He lived on as a recluse, becoming more and more absorbed in solitary interests. He took up painting for his own satisfaction and after a number of years his work was recognized in a small way in the art world.

      His mother, broken by her son's tragedy, clung to him pathetically. On one of his trips abroad with her they met on the steamer .mw-parser-output .nowrap,.mw-parser-output .nowrap a:before,.mw-parser-output .nowrap .selflink:before{white-space:nowrap}Mr. and Mrs. Edward Joralemon with their lovely daughter Anne. Jed knew it was these people who had adopted Gwen's child. Anne was his own daughter! He got acquainted with her and they found themselves extraordinarily congenial, probably because Jed exerted himself as never before in order to interest his daughter.

      One evening Anne confided to Jed that she was an adopted child and that she longed to know about her own parents but had been discouraged from inquiring about them. Jed faced the question whether or not to tell her that he was her father. In his loneliness, he longed to claim this lovely and congenial girl as his daughter, yet he hesitated to disturb her peace of mind.
    choices:
    - label: The reader who decides that he is to tell turns to paragraphs J-17.
      to: J-17
    - label: The reader who decides that he is not to tell turns to paragraphs J-18.
      to: J-18
  J-16:
    title: J-16
    text: |-
      Jed had not foreseen that if he refused to give a motive for the murder the public would think one up for him. The first thing that came out was that he had spent the hours preceding the murder on the rocks with Vauncey. It was obvious to newspaper readers that Jed had murdered Bullen because he was in love with Bullen's wife and wanted to get him out of the way. They assumed that Vauncey had connived at the murder.

      Jed's lawyer explained to him that while a jury would doubtless acquit a man for murdering his wife's lover, they would not be lenient toward one who murdered his mistress's husband. Jed, in the dilemma of implicating the innocent Vauncey by his silence or of admitting that he had found Carol in Bullen's room, saw that he must clear Vauncey at Carol's expense.

      Carol, who would have been willing to have Jed implicate her in order to save himself, was furiously jealous at having her reputation sacrificed to save Vauncey's. She had not the slightest doubt that there had been an illicit love-affair between Jed and Vauncey and she made the trial a sensational international front-page affair. The story was later turned into a movie which featured the popular young American society man, his beautiful gay young wife who had been seduced by the multimillionaire Bullen, cast as the villain, and the villain's convent-bred wife, who was frankly compared to a repentant Magdalen; all this against the background of the palatial yacht and a wild life lived in a shower of gold.

      For a time it looked black for Jed, but he was finally acquitted. He was very willing to coöperate with Carol in getting the divorce which she immediately demanded. Later she married an English officer in a crack regiment.

      Vauncey was horrified at Carol's desertion. Under the circumstances she herself would not abandon Jed, but felt that her life was bound up with his in a common expiation. She believed herself equally guilty with the others, although technically innocent. She knew she had gone alone with Jed to the rocks on the evening of the tragedy against her better judgment because she had so passionately longed for the kiss of renunciation which she had allowed him.

      Although her religion forbade her marrying Jed, she found consolation in having him near her. She returned to her parents' château in southern France and devoted herself to making the two old people happy as long as they lived. Jed settled down in a villa three miles away and once a week was received at dinner at the château. In the evening he and Vauncey played backgammon. This routine became a set habit which continued after the death of Vauncey's parents, and was broken only by Jed's yearly visits to the United States as long as his mother lived. A long and placid life was measured by these evenings as cathedral days are measured by the melody of chimes. Jed was not unhappy. He had found the perfect woman—in other words, the woman whom he could not have.

      The consequence of Jed's bearing himself with dignity in the catastrophe brought on by a foolish misspent youth was that he gathered up a few fragments after the crash and pieced together a not unendurable middle age. The consequences of earlier repentance might have been even better.
    choices: []
  J-17:
    title: J-17
    text: |-
      Since Jed's attention had been wholly on his own feelings, he was unprepared for the tumult of emotion which his disclosure that he was Anne's father roused in the unsophisticated girl. Too late he realized that though she had always known herself adopted, she had dreamed of a father overwhelmed by undeserved misfortune; not of one who had been involved in a notorious murder.

      She learned for the first time that he had deserted her mother in time of need and allowed his child to be born with the stigma of illegitimacy. Brought up in wealth, it meant little to her that Jed had provided for Gwen, financially. Nor could she understand that a woman might be stronger than a man and responsible for a disastrous situation. She saw her mother seduced and herself made an outcast through the pusillanimity of this man who now expected her to love him.

      The disclosure that her mother had later married an ambitious young plumber who had become a contractor and now was extremely well-to-do brought her no comfort. At the same moment she lost both her dream father and her dream mother. Anne took her story straight to her foster-parents, never so dear to her as now. Enraged with Jed for having told her the harsh truth, from which they had always protected her, Mr. Joralemon told him in plain English what he thought of this act, and Jed, who up to this time had been thinking only of his own loneliness, was aghast at what he had done.

      He looked back over his life and saw how futile it had been, though he had always had good intentions. He had never wanted to hurt any one, yet he had brought nothing but suffering to those whom he loved. In his self-abasement, life was more than he could bear. Next morning he was not to be found. His cabin had not been slept in. At the end of a few hours everybody on board knew that the charming Mr. Harringdale had thrown himself from the ship during the night. He left a broken mother to spend the rest of her life alone and a daughter who would never forget that she had sent an unloved father to his death.

      The consequence of this action was that for the last time Jed had done the wrong thing.
    choices: []
  J-18:
    title: J-18
    text: |-
      Jed's decision not to tell Anne that he was her father shows that for the first time in his life he knew a love which made another person's happiness more important to him than his own. This lovely girl, on whom he had a claim which he had refused to press, was dearer to him than his mother, Gwen, Carol or even Vauncey had ever been.

      The sense of fatherhood, awakened so late, gave him strength to put aside his selfish desire to claim her. When she confided to-him her day-dreams about her unknown parents, the realization that he was saving her from the knowledge of her illegitimacy and of the worthlessness of her father gave him a new self-respect. Now indeed he felt that he was Anne's father, protecting her from shock and disillusionment, even though at the expense of his own satisfaction.:

      The consequence of this act was that some of his depression left him and his released energy focused itself on his painting. He had work now, and through it he found congenial friends.
    choices: []
  Saunders:
    title: Section III — Saunders
    text: |-
      Saunders Mead was brought up in a pleasant frame house, painted white, in Franklin, a small New England town. His father who was the postmaster, had only a small income, but the Mead children never thought of themselves as poor because there were always cookies in the pantry. Saunders, the eldest of the family, early developed a sense of responsibility and began delivering papers when he was thirteen years old. What he earned he could keep for himself, with the proviso that he save a certain amount of it, and this ready money made him rather an important person with the other children. In later years he appreciated his early experience in saving, spending, and using his money.

      Among his schoolmates were Jed Harringdale and Helen Rogers. Carol Lane, who lived in New York, spent her summers in Franklin with her grandmother. The four children were close friends and never lost sight of one another after they were grown. As soon as Saunders was graduated from high school he got a steady job in the Franklin Dry Goods Store, where he had already worked during his summer vacations and Christmas holidays. Soon afterward, through his father's death, he became the head of the family.

      Old Mr. Braley, proprietor of the store in which Saunders worked, took a great interest in the reliable and enterprising boy, and raised his salary by infinitesimal gradations, as was the custom in Franklin. By the time Saunders was twenty-two he had five hundred dollars saved up; and Mr. Braley, learning this, offered him a chance to invest the money in the store, with the idea of gradually but regularly buying a controlling interest. Braley planned to retire fairly soon, and there was no one to whom he would rather turn over the store in which he had worked for fifty years than young Mead.

      Saunders was tremendously interested in the store and had spent a large part of his time reading business literature and developing merchandising projects.

      Mr. Braley's offer would not be repeated, because if Saunders did not take it, another clerk, who was Mr. Braley's second choice, would get the chance. But Saunders's younger brother Alfred wanted to go to Massachusetts Tech to study architecture and had saved up a hundred dollars toward this purpose. If he could borrow Saunders's five hundred, he could manage, with the utmost economy, to scrape through his first year. The following years would be easier, because if he made a good record he could count on a scholarship and upon work found for him by the students' employment bureau. The lad was more brilliant than his elder brother and very lovable. He was extremely dear to Saunders.
    choices:
    - label: The reader who thinks Saunders should lend the money to Alfred turns to paragraphs
        S-1.
      to: S-1
    - label: The reader who thinks he should invest it in the store turns to paragraphs S-2.
      to: S-2
  S-1:
    title: S-1
    text: |-
      Saunders gave his five hundred to his brother Alfred without complaining of its being a sacrifice. He had reward in Alfred's brilliant work which secured a tuition scholarship in the boy's second year, with offer of work in the students' lunch-room. In view of Alfred's attainments it was a pity for him to divert a part of his attention to drudgery, and Saunders decided to give him another five hundred each of the four years he spent at the institute of technology. During Alfred's senior year Alfred chose for his thesis a design for a grammar-school for Franklin, because for several years there had been talk of building a new school on the large lot where the Mead house stood. It was centrally located and in every way desirable for a school.

      The aldermen took definite steps toward the actual accomplishment of this much talked of scheme when Alfred had graduated with high honor, and his plans, exhibited in the City Hall, were exciting favorable comment. When Donovan, president of the board, called one evening to discuss matters with Saunders, now the head of the family, Saunders knew that Alfred, Marge, and Jimmie were in the kitchen dancing silent jigs, with their hands over their mouths to hold in their yelps of joy.

      At first it was all plain sailing. The interview began pleasantly with the statement that the Board of Aldermen had virtually decided to utilize Alfred's plans for the new school. Thereafter Donavan conveyed to Saunders an offer of ten thousand dollars for the Mead property, which, though a generous sum, was not excessive. But presently Saunders began to hear something beneath the words. The alderman was explaining to him that since no real-estate agent was concerned in the deal, Saunders would pay what would otherwise have been the agent's commission directly to the Board of Aldermen—indeed, to the president himself.

      It developed further that the commission was an unusually large one—two thousand dollars, in fact. When Saunders protested in honest bewilderment, he was told curtly that the owner of a certain lot on the other side of the railroad tracks was ready to agree to this proposition. Saunders was very stupid where dishonesty was concerned, but his eyes were completely opened when he learned that he must make the two-thousand-dollar payment in bills and not by check.

      Saunders suddenly found himself faced with the problem of whether or not to close his eyes to this small piece of graft. If he did, his brother's excellent design would be accepted, and the fact would give Alfred a fine start in his profession, the Mead family would be able to move into a house with modern conveniences where the housework would be easier for Mrs. Mead, and a couple of thousand dollars could be put aside toward a rainy day. Moreover, the school would be built in a good location instead of an unsuitable one across the railroad tracks. If, on the other hand, he refused the offer, Alfred's chance would be lost and he himself might be forced to denounce Donovan in an effort, probably futile, to block the scheme of putting the school-house in a dangerous location.
    choices:
    - label: The reader who thinks he should accept the offer turns to paragraphs S-3.
      to: S-3
    - label: The one who thinks he should refuse turns to paragraphs S-4.
      to: S-4
  S-2:
    title: S-2
    text: |-
      Saunders hated to disappoint his brother Alfred, who took disappointment hard; however, he was determined to buy an interest in the store. But while the business outlook was cheerful, things were not so pleasant at home. Alfred's brilliant intellect was combined with emotional instability, and he was now down in the depths. The other members of the family reproached Saunders for his selfishness.

      As soon as there was an opening in the store, Saunders, with Mr. Braley's consent, offered the job to Alfred as a chance to earn money toward getting an education, and Alfred's spirits rose as quickly as they had sunk. He made a wretched clerk and Saunders had to exert himself to cover up his sins and keep him from being fired, but the lad did save his money toward going to Tech.

      At this moment Luck stepped in. A great-uncle who had paid no attention to them for years died unexpectedly, leaving five hundred dollars to each member of the Mead family. Alfred threw up his job and went radiantly off to Massachusetts Tech, and Saunders thankfully got a competent clerk to take his place. Saunders himself was not quite sure what to do with his five hundred dollars. Out of his two-thousand-dollar salary he was buying one thousand dollars' worth of stock yearly, in two instalments. After deducting necessary expenses, including a moderate board paid to his mother, he had virtually nothing left for recreation. He was dropping out of his crowd and the girl he most admired, Helen Rogers, was constantly going off with Jed Harringdale, in Jed's racer.

      Saunders reflected that one is young only once, and that if he spent his windfall on a second-hand car he could have the time of his life. But he would be risking his standing with Mr. Braley by doing this, for Mr. Braley had never bought a motor-car when he was a lad; his father's horse and buggy had been good enough for him. Moreover, Saunders wanted to be a millionaire and he knew there was truth in the old axiom that the first ten thousand is the hardest.
    choices:
    - label: The reader who wishes him to buy the car turns to paragraphs S-5.
      to: S-5
    - label: The one who wishes him to invest his windfall in the store turns to paragraphs S-6.
      to: S-6
  S-3:
    title: S-3
    text: |-
      For some months after Saunders accepted the plan proposed by Donovan, selling the lot to the city and paying part of the money back to the president of the Board of Aldermen, he was nervous lest some one discover the deal and misunderstand his motives. But Donovan was too adept at this sort of thing to run into any danger whatever, and Saunders became reconciled to his own slight deviation from rectitude because of his mother's satisfaction in the convenient new home and Alfred's enthusiasm and delight in having his plans accepted.

      About the time the excavation was finished and the foundation begun Saunders was disturbed by a sudden drop in Alfred's spirits. The boy became glum and uncommunicative, replying to Saunders's questions simply by saying curtly that everything was going well. Certainly he was attending to business, for he had numerous lengthy conferences with the aldermen, each of whom, by a curious coincidence, was furnishing part of the supplies for the building; one owned a brick-yard, a second ran a lumber-yard, and so on.

      Saunders realized what he had put his younger brother up against, seeing what temptation there was to connive in dishonesty in the furnishing of materials. Disturbed, he asked Alfred frankly if there was graft in the proposition. Alfred, who had always looked up to Saunders, turned on him with sulky resentment.

      "You're a great one to pry into my affairs," he retorted, "after you split profits with Donovan, yourself!"

      Then the whole thing came out. The aldermen pretending they doubted, after all, that the plans were practicable, had put off signing the contract, until Alfred was beside himself with anxiety. Then Donovan had come into the open and explained that the school for which a hundred thousand had been appropriated, was actually to cost only sixty thousand. If Alfred wanted to be the architect, it would he necessary for him secretly to substitute for the plans publicly displayed, after being accepted as his thesis, a new set of plans calling for inferior materials and construction. The forty thousand dollars thus saved was to be split up among those who were in the ring. Alfred had at first refused, with young indignation, but when Donovan had told him how Saunders had come round, Alfred, disillusioned, had finally capitulated.

      Saunders, bitterly regretting his own false step, urged Alfred to give up the whole business, but Alfred, with unexpected stubbornness, said that Saunders's day of authority over him was past. He assured his brother that although the material was scamped and the construction altered to a cheaper form, the building was still fireproof and better than a good many buildings about which nobody made any fuss.
    choices:
    - label: The reader who thinks Saunders should expose the ring turns to paragraphs S-7.
      to: S-7
    - label: The one who thinks he should keep quiet turns to paragraphs S-8.
      to: S-8
  S-4:
    title: S-4
    text: |-
      Thoroughly outraged by his glimpse into the corruption of the city government, Saunders thought he had only to tell of the dishonest offer made him, to rouse the community and cause the citizens to insist that the grammar-school be built on his lot, which was obviously the right place. To his astonishment, the respectable element did nothing, each man excusing himself on the ground that no one else took any interest in the corrupt conditions.

      Donovan, as a counter-blast, set up the cry that the immigrant children across the railroad tracks were just as important as the silk-stockinged children of the plutocrats, neglecting to mention that the children on the town side of the tracks outnumbered those on the other side ten to one. The school-house was built across the tracks on the lot of the man who would give graft, and the public growled but did nothing about it.

      Alfred grouched a little at his brother's stiff-necked refusal to compromise with the powers that were, but Saunders knew that in his heart the lad respected his honesty. Alfred's bitter disappointment was counteracted by an offer of a small position in a famous New York architectural firm, which made a practice of securing the honor students from the technological institutes.

      Public interest in the school controversy had almost died down when a little girl was killed crossing the tracks on her way to the new building. So long as the issue had been a theoretical one, nobody had taken it seriously, but in indignation over the child's unnecessary death the town rose in wrath and voted in a complete reform ticket, with Saunders as one of the aldermen. It was too late to remove the school building, but the town in coöperation with the railroads lowered the tracks at the school crossing. Donovan's crowd used the consequent increase in taxes as a weapon against the reform administration, and were put in the saddle again at the next election.

      Alfred was now off Saunders's hands and already had had an increase in salary. His future was assured. But Marge now needed money. A well-known singing teacher who spent his summers in Franklin was so impressed by the possibilities of her voice that he had given her free lessons and now urged that she continue her studies under his instruction in Boston. When this famous teacher was willing to give Marge his valuable time without payment, it seemed as if her family should be glad to make sacrifices in order to pay for her board in the city. Marge had a part of her uncle's gift left, and Mrs. Mead offered to turn over to Marge what Saunders was paying her for board. Saunders would be able by rigid self-denial to supply the rest.

      At this moment Barton Brothers, who had recently opened a branch store in Franklin, approached Saunders with an offer of a position in their Cleveland store, where he would receive a thorough training in modern merchandising methods. The manager of the local branch told him frankly that they had watched his work at Braley's and recognized him as a man with a future. The Cleveland position offered him an opportunity he would never get at Braley's, since the man who had bought into the firm when Saunders had failed to do so was not interested in advancing him. The cost of moving the family to Cleveland or of supporting them apart from him in Franklin had to be taken into account. He would have no money left to give to Marge.
    choices:
    - label: The reader who thinks that he should stay at Braley's and finance Marge in Boston turns
        to paragraphs S-9.
      to: S-9
    - label: The reader who thinks he should accept the Cleveland offer turns to paragraphs S-10.
      to: S-10
  S-5:
    title: S-5
    text: |-
      Saunders got his car with the money his uncle had unexpectedly left him, but he didn't get his girl. He found it wasn't a car she was interested in but the man in it—and the man was Jed Harringdale. But although Helen would not go with Saunders, he was not one to give up easily and he turned up at all the parties where Helen was. He was not a young Lochinvar out of the West but a steady and persistent wooer who believed that the best man wins in the end. In order to go about with the crowd without looking like an oh-so-wan-and-pale young lover it was necessary for him to take another girl with him. When some one teased him about Carol Lane he suddenly realized that the necessary girl whom he took about with him was always Carol.

      Carol, whose home was in New York, had for many years spent part of her summers in Franklin with her grandmother. She had at one time been engaged to Jed Harringdale, and they continued friends after the brief engagement was broken. Franklin had always seemed more like home to Carol than her father's Park Avenue apartment or his newly acquired place on Long Island, where a young stepmother ruled supreme. Although the Lanes' fortune was new, their names were in the Social Register, and Carol's piquant beauty was snapped by newspaper photographers at Palm Beach and Long Island race-tracks. She was an exuberant young woman, for whom the moment was sufficient. She didn't deal in futures. With Carol, action followed stimulus, with no pause for consideration between. Life to her was an exciting drama.

      At just about the time when Saunders discovered how much he was enjoying Carol's company in spite of being in love with Helen, Helen eloped with Jed. In his loneliness Saunders turned more and more to the mercurial Carol. Though Helen was the love of his life, he was not the type to cry over spilt milk. Carol was not only beautiful and vivacious but so wealthy that marriage with her would be an extraordinary achievement for a young clerk in a small-town store. It seemed to him very strange that this glamorous young creature should be interested in him, yet he could not help seeing that she was. He had been her childhood hero since the day he got her out of one of her frequent scrapes and sent her home with a good scolding, which she hadn't listened to.

      Saunders faced the problem of whether or not to ask Carol to marry him. He was still in love with Helen—whom he could not have. But he enjoyed Carol and he had good reason to believe that her father would advance the career of his daughter's husband.
    choices:
    - label: The reader who thinks he should ask Carol to marry him turns to paragraphs S-11.
      to: S-11
    - label: The reader who thinks he should not turns to paragraphs S-12.
      to: S-12
  S-6:
    title: S-6
    text: |-
      Mr. Braley found in Saunders a young man after his own heart and raised his salary because he saw that the money would come right back into the business. Although there was little of the play-boy in Saunders, yet those early years, when he turned a nickel over twice before spending it, were bitterly hard for him. He kept away from the young people, since he was not willing to go with them unless he paid his share, and there were times when he longed to exchange Mr. Braley's commendation for the cordial approval of his own generation.

      Saunders's next opportunity to advance himself in business came when Barton Brothers, a New York store which had been in the habit of showing goods at the hotel twice a year, opened a permanent branch in Franklin. They offered Saunders the managership of this branch, with limitless possibilities of advancement if he made good.

      As Saunders knew that he would make good, a big prospect opened before him. Although he now owned some stock in Braley's store, it was not yet enough to be a major factor in his decision; but it was clear to him that the prosperity of Mr. Braley's store depended on him, and in his new position he would be in direct competition with Braley. Moreover, his departure to a rival store would be a serious blow to the old man, who had been like a father to him.
    choices:
    - label: The reader who thinks he should accept the new offer turns to paragraphs S-13.
      to: S-13
    - label: The one who thinks he should stay with Braley turns to paragraphs S-14.
      to: S-14
  S-7:
    title: S-7
    text: |-
      Saunders's first act, after he discovered how Alfred was being bullied into acquiescing in graft, was to go to Donovan, the president of the Board of Aldermen, and threaten him with exposure if he did not build the school-house according to the original plans. When Donovan pointed out that he had something on Saunders which he would not hesitate to use, Saunders carried his story to the editor of the paper of the opposition party. That paper doubled its circulation in the weeks following. Franklin rang with the scandal and the conservative group who did not want the taxes raised took advantage of the hysteria to get the school building postponed indefinitely.

      Saunders himself was quickly involved, because the man whose lot had not been purchased had been propitiated with the contract to haul dirt and in retaliation for losing this job he exposed the deal between Saunders and Donovan. The outraged citizens lumped Saunders with the aldermen in their general condemnation. Mrs. Mead could not hold up her head before her neighbors, and Alfred ran away.

      Saunders set his jaw. He accepted the punishment for his misstep as right, and determined to live down his disgrace. Later when Alfred, who was living a hobo life, wrote home for money, Saunders supplied it, although it meant that he had to deprive himself of everything but bare necessities.

      Mr. Braley was the only one who understood Saunders's position and respected his desperate attempt to return to the path of complete honesty. When he died, some years later, he left Saunders an interest in the store and commended him in his will for the stanchness with which he had fought down disgrace. Saunders's fellow-citizens, who had not realized that winning back lost esteem is far more difficult than leading a life of continuous integrity, were so impressed by Mr. Braley's action that they felt more kindly toward Saunders. The man who had bought into the store at the time when Saunders, instead of taking advantage of Mr. Braley's offer, gave his money to Alfred, liked and trusted Saunders and the two carried on the business harmoniously for many years.

      Alfred was not a complete disappointment, because, curiously enough, he developed a talent for verse-making in his wandering life. He was "discovered" by the Greenwich Village Poetry Association, and a slim volume of his verse, with a picture on the jacket of a man walking the railroad ties, was published and acclaimed. Saunders continued to support the poet as he had the tramp and his mother was prouder of her poet son than of any other of her children.

      The consequence of Saunders's having acted dishonestly when he was essentially an honest man is a proof to any thoughtful person that to make a success in crime one must put one's whole soul into it as one must into any profession. People raised to be honest would better resign themselves to remaining honest.
    choices: []
  S-8:
    title: S-8
    text: |-
      After the school-house was built Mrs. Mead, Marge, and Jimmie were bursting with pride, but neither Saunders nor Alfred could look at it without a sinking of the heart. It represented to Saunders the loss of honesty, and to Alfred the loss of artistic integrity.

      Donovan, who never felt quite sure about those Meads, obtained for Alfred a position with a New York contracting firm which was in need of an architect who could be influenced. Saunders, thinking that here was a chance for his younger brother to start anew, was glad to have him go.

      Mr. Braley, the head of the department-store where Saunders worked, died a couple of years later, and Saunders was thrown out of this job by the young man who had bought in when Saunders refused the opportunity. Fortunately, Alfred was able to get him a position in the business office of his New York firm, and the whole Mead family moved to the city. They were all surprised at the change in Alfred. He earned what seemed to them a stupendous amount of money and spent it ostentatiously.

      Saunders soon found that his own work in the business office included shutting his eyes to shady practices. Dishonesty at the head seeped down through the whole office. By the time he was advanced to the position of office manager he was adept at keeping the private books of the partners, which were different from those from which the income tax was computed.

      Alfred married the daughter of one of the members of the firm. People knowing the girl said unkindly that he married her to get the partnership, which he obtained soon afterward.

      Saunders never married. He lived on Park Avenue with his mother, who talked continually of the old Franklin days, although she was very proud of her two sons who made so much money.

      Margery, to Saunders's great distress, became an out-and-out social climber, and after many years of trying unsuccessfully to marry into some established New York family, married a man who had made a tremendous fortune in silk underwear.

      Jimmie was the main interest of Saunders's life, and the boy looked up to him just as Alfred had done in his early years. Saunders kept him away from the rest of the family most of the time, first at a good prep school, later at a technical institute and on engineering expeditions during his vacations, for the boy early showed marked engineering talent. After Jimmie's graduation Saunders encouraged him to go into electrical workshops as a common laborer in order to obtain practical experience, not only in doing the actual work but later, when he became a foreman, in handling men. Alfred and Margery tried to combat these plans, finally crossing Jimmie off the slate as a failure; but Jimmie, who had Saunders's slow, sure brain, rather than Alfred's brilliancy, plodded along until quite suddenly, after years of hard work, his firm recognized his ability and reliability. He finally designed a new type of electrical engine and became richest of them all. Margery and Alfred began to appreciate him then, but to Saunders and to Jimmie himself his achievement was not the making of a fortune; it was the recognition he obtained in his profession.

      The consequence of Saunders's going in for crooked practices was that the whole family had plenty of money and Jimmie, who was too young to know about it, kept his integrity of character and integrity of work. Only three fourths of the brothers and sisters went bad.
    choices: []
  S-9:
    title: S-9
    text: |-
      The first time Marge's name was in the New York papers as an also-sang at a concert was a great occasion for the Meads. Mrs. Mead showed the paper to all the neighbors and then cut out the item and put it in the box where she kept one of Saunders's baby curls, Alfred's first drawing, Marge's best baby cap, and Jimmie's first Reward of Merit. But this did not mean that Marge was self-supporting; in fact, it meant additional expense for proper concert gowns. It was six years before Marge could pay her own way by singing in a church choir and in a minor rôle at the Metropolitan.

      Saunders drew a long breath of relief. He was glad he had given Marge her chance, although it had been a hard pull. He had not had the increases in salary he had expected, because the competition of the Barton store had seriously threatened Braley's. It had been necessary to make over the whole store system in order to keep going, but at last, thank Heaven, they were all on their feet. With Marge off his hands, Alfred doing well and happily married and the store safe, Saunders could now think a little about his own future. The Meads had recently sold the house and lot to advantage, Jimmie was almost through school and would soon be able to support himself, Mrs. Mead's health was still fairly good, and Saunders was free to carry out his long-cherished dream of a year at Harvard University, studying business management. Jimmie chose this moment to make the highest grade in the history of the Franklin high school.

      The principal of the high school had a serious talk with Saunders. Smiling bravely, though with a sinking heart, Saunders learned that little Jimmie, whom he had always thought of as an ordinary person like himself, had it in him to become a great engineer. The principal was frank with him.

      "Saunders," he said, "you must send this boy to college and not allow his brilliant future to be sacrificed as yours has been. When you graduated I longed to see you go to college, but of course your father's death made that impossible. But you have now a chance to realize your own ambitions through your brother."
    choices:
    - label: The reader who decides that Saunders is to give up his year of study in order to send
        Jimmie to college turns to paragraphs S-15.
      to: S-15
    - label: The reader who decides that he is to set Jimmie to work and take the course at Harvard
        himself, turns to paragraphs S-16.
      to: S-16
  S-10:
    title: S-10
    text: |-
      Saunders was able after two years to send for his family to come to Cleveland to live with him. He was by that time earning a very good salary, and although he was away much of the time, inspecting Barton stores in other places, yet Cleveland was and would be his headquarters. After the first lonesomeness was over, the Meads were all delighted with the city. Marge fitted herself to be a teacher of singing, and obtained a good position in the Cleveland school system. Jimmie, who was practical as well as brilliant, went to Antioch College, where he could be self-supporting.

      The first tragedy of the Mead family occurred as an indirect result of the move. Alfred piled his whole family into a car and came out to visit them in his somewhat happy-go-lucky way. In a collision on the outskirts of Cleveland, Alfred was killed and his wife seriously injured.

      As soon as Alfred's wife could be moved from the hospital she came to the Mead house, where she remained with her children during a slow convalescence. When she was well enough to go home the Meads all begged her to remain with them permanently. Not only were they devoted to her and the children but they needed her because Marge was about to be married, Jimmie was away at college, and Saunders was at home only part of the time, leaving Mrs. Mead without a companion. Since Alfred had left no life insurance and Saunders had assumed the responsibility of supporting his brother's family, Alfred's widow saw that she could make that duty easier for him by staying in Cleveland.

      The consequence was that Saunders later on married his brother's widow and kept in the family circle one whom they had always dearly loved and the Mead family lived a happy and fairly prosperous life, all of them considering Saunders the most wonderful man in the world.
    choices: []
  S-11:
    title: S-11
    text: |-
      Saunders Mead could hardly believe that Carol was going to marry him until they were actually in Franklin's Episcopal Church, with pretty bridesmaids, ushers imported from New York, Alfred as best man, in Saunders's pocket a staggering check from the bride's father, and newspaper reporters scribbling in the back pews.

      Saunders had always looked upon marriage as the preliminary to settling down to a quiet and domestic life, but the settling down was postponed until after a honeymoon in Europe, finding an apartment in New York (for the couple moved. there), a whole winter of entertaining and being entertained, a terrible to-do attendant upon the arrival of a baby, a moving of the entire household to a suburban home in Greenbriar, a winter in Palm Beach to rest Carol's nerves, a summer in Newport to recover from Palm Beach, another baby, a larger house in Greenbriar with a beach for the babies, a terrifying illness for one of the babies, and finally a motor accident, ushering in a nervous breakdown for Carol which necessitated three months in a sanatorium and an increased staff of servants when she came home.

      With all this going on, poor Saunders was under the obligation to send regular sums to his mother and to make good in his father-in-law's brokerage office. If he did not, everything would crash, for Mr. Lane, who was putting up what seemed to Saunders a stupendous amount of money for their household expenses, made it clear that he was not going to do this forever. Saunders did the only thing he could do. He turned his single-track mind off from Carol and her impediments and upon his work, and persisted in his determination not to let his social or even his domestic life interfere with the business of making money.

      Carol, who naturally expected to be the center of the life she had created, was surprised, hurt, and indignant. When she found that the husband whom she had expected to manage had a will of his own, she felt fully justified in taking on as a constant escort a young poet who agreed with her that the higher things of life must not be sacrificed to material: gains, and that the American husband does not understand the finer sensibilities of his wife.

      Saunders was not jealous of his wife's tame cat, but his old-fashioned notions of respectability were outraged by the situation. A little later, however, he wished the poet back, for the successor was a titled European who after being photographed with Carol at the races was arrested for raising to five hundred dollars a five-dollar check she had given him at the track.

      Carol's father had a serious talk with his son-in-law, in which he told Saunders frankly that a man who could not govern his own wife was looked upon as a weakling. Mr. Lane declared that Carol had behaved herself as long as she was under his own supervision, and that it was a husband's duty to protect an inexperienced young wife against her unconsidered impulses. Soon afterward Carol, who had been nervously upset by the humiliating scandal, told Saunders that she was going to Bermuda with the Elwells to get away from all the talk.

      Elwell, a neighbor of the Mead's, had recently made a fortune in speculation which had enabled him to retire his former wife with a big alimony and substitute for her the latest thing in wives, with whom Carol had struck up sudden intimacy. Saunders, though slow, had had five years in which to learn to size up people like the Elwells. He did not trust either of them and he thought they had a bad influence on Carol. Unable to leave his business and go with the party, Saunders foresaw that Carol would get into trouble again.
    choices:
    - label: The reader who thinks that he should forbid Carol's going turns to paragraphs S-17.
      to: S-17
    - label: The one who thinks he should not interfere turns to paragraphs S-18.
      to: S-18
  S-12:
    title: S-12
    text: |-
      Since Saunders could not accept Carol, who loved him, as a substitute for Helen, whom he loved, he plunged into work to obtain the forgetfulness which Jed, under similar circumstances, would have sought in drink. By shrewd bargaining he sold his car for almost as much as he had paid for it and put the money into the store. From that time on, Mr. Braley had no reason to complain that his assistant's attention was wandering from his work. Saunders very soon became a junior partner and when Mr. Braley died was able to borrow money from the bank in order to buy in the rest of the stock. The store was growing more and more prosperous under his direction, and he now had an income of about ten thousand a year.

      Five years after Helen had eloped with Jed she again came into Saunders's life. Jed had died, leaving Helen struggling to support her child, whom she would not turn over to Jed's wealthy mother—the price the old lady demanded for any help. Saunders loved Helen more than ever. Although she always looked tired and drawn, to Saunders she still seemed the most beautiful woman in the world. He admired her gallantry and her devotion to her child. He asked her to marry him and she told him honestly that she would be glad to marry him for the child's sake but that she wanted him to understand clearly that what she felt for him was gratitude, not love.
    choices:
    - label: The reader who thinks he should marry Helen under these circumstances turns to paragraphs
        S-19.
      to: S-19
    - label: The one who thinks he should not marry her turns to paragraphs S-20.
      to: S-20
  S-13:
    title: S-13
    text: |-
      Sauunders might not have had the courage to leave Mr. Braley if he had foreseen the effect on the old man. While Saunders was making a brilliant start with the new store of which Barton Brothers had made him manager, Mr. Braley, whose store he had left, was getting into difficulties. In his desire to compete with the rival store and his former clerk he accepted all the new ideas that were offered to him. He plunged into a poorly planned advertising campaign and stocked up with ill-chosen novelties.

      Saunders tried to reason with Braley, but the latter no longer trusted Saunders. He went into bankruptcy a year later, and Saunders's new firm bought his store and his stock, Saunders saving what he could from the wreck for his former employer by insisting that he be paid a high price. But the old man's spirit was broken. He could not forget that he was a bankrupt.

      Saunders's work was so fine that he was soon given a position in the main New York office of the department-store. He was rapidly advanced, until some years later he became a stockholder and director of the company, and finally vice-president.

      He made his mother a good allowance, Alfred was designing a garden city, Marge, after a good musical education, had married a violinist, and Jimmie, who was a mining engineer, had already made a fortune through speculation in oil lands. Saunders at forty-nine was free at last to take up social life and he decided that it was time for him to marry.

      Florence Lamont had for some time been associated in his mind with this step. She belonged to the old Lamont family of Westchester, and was so charming in her kindliness and culture that people were always saying, "Why hasn't Florence Lamont ever married?" Saunders had met her first through welfare work in connection with working girls' summer camps, and later, drawn together by a common interest in Chinese porcelain, the two became firm friends.

      With middle-aged deliberation, Saunders was preparing to make a proposal of marriage when Miss Lamont's orphan niece, Mahalia Lamont, shot like a comet across his horizon. She represented to Saunders all that he had given up in his youth—freedom, gaiety, irresponsibility—and the repressed longings of years burst out in a wild, mad love for this beautiful girl. Shocked as he was to see himself trailing after a woman thirty years his junior, he was as helpless as a moth circling a candle. One part of him said, "There's no fool like an old fool," and another part said, "You have only one life to live." He was reasonably sure that Mahalia would marry him, for she had said, with the young frankness that appalled and enchanted him, that she was tired of being a poor relation and could love any man who released her from financial dependence. He knew that she was a lavish spender—but for what had he made ten million dollars?

      Saunders was faced with the problem of whether to marry the congenial, suitable woman who loved him and whom he liked or the vivid girl with whom he was infatuated.
    choices:
    - label: The reader who decides that he is to marry Florence, the aunt, turns to paragraphs
        S-21.
      to: S-21
    - label: The reader who decides that he is to marry Mahalia, the niece, turns to paragraphs
        S-22.
      to: S-22
  S-14:
    title: S-14
    text: |-
      Things looked black for Mr. Braley's store after the new store opened. Every one went to Barton's, first out of curiosity and later because the prices were lower. Saunders saw that Braley's must adopt anew merchandising policy, and though Mr. Braley fought him at every step of the way he carried through his scheme of lower prices, cheaper goods, quick turnover, cash payment, sales, and well-directed advertising; in short he made the old conservative store into an up-to-date paying concern.

      Mr. Braley didn't like the changes and didn't hesitate to say so, but Saunders forced his chief into prosperity against the old man's will. Saunders was built to make money and nothing could stop him. As Mr. Braley became reconciled to the new ideas, he gradually came to feel that he had thought of them himself. When he died he left his interest in the store to Saunders.

      Saunders, now a prosperous young business man, began to consider marriage. Helen, who had been his only love, was a widow now, struggling to support her child, but when Saunders asked her to marry him she refused and he definitely put aside all hope of ever winning her. This left an empty place in his life, and since he no longer dreamed of Helen he became more interested in other girls. Suddenly he became aware of Ada Winters.

      His sister Marge had brought Ada home to supper one night, and as Saunders saw her wistful little face across the table she seemed to him like a child looking through a window at a party she could not share. When he walked home with her that night she poured out her soul to him in response to his kindly interest. He had always known the outside of her life, now he knew the inside. She told him that she had never known that such happy family life existed in the world, and she would have been a different girl if she could have had brothers and sisters like his and a mother like Mrs. Mead. Not that she was saying anything against her own family, she hastily added, with a little sigh.

      Saunders drew her out with sympathetic questions. She had had a sad life. She supposed she was too sensitive, but she couldn't help things hurting her. She felt things too much. Her whole day could be spoiled if some one spoke unkindly to her. She didn't know what made her tell Saunders these things. Her parents loved her, but they didn't understand her. She was handicapped by the feeling that people did not like her. She had never been to a party but what she had come home and cried because she wasn't a popular girl. She was so shy that she had to wait for advances from other people. She had often thought that if she could only get away from Franklin and make a new start somewhere else—but she was afraid her parents couldn't spare her.

      With sudden, unexpected fierceness Ada declared that if she could only get her chance she would show people what there was in her. Then, getting control of herself, she ended with a gay little laugh, more pathetic to Saunders than her wistfulness, saying that she was sure it would all come out right in the end.

      The little girl brought out all of Saunders's tenderness, and in the weeks that followed he went out of his way to see that poor Ada was included in the Mead family good times. She was so grateful that it was touching. Before he knew it, she was leaning on him and he was startled to realize how much he meant to her. One night with a shy impulsive gesture, she kissed him good night and then fled like a frightened child.

      This incident brought Saunders face to face with the problem of whether or not he should ask Ada to marry him. His feeling toward her was different from what he had felt for Helen. Looking back, he could see that Helen had had something of the masculine in her, but Ada was all feminine. She made him feel strong and competent. He longed to create for her an environment in which she could bloom into happiness and success, for he had come to realize that she was a highly talented girl. Did he love her? Yes, he was sure he did.
    choices:
    - label: The reader who decides that Saunders is to marry Ada turns to paragraphs S-23.
      to: S-23
    - label: The one who decides that he is not to marry her turns to paragraphs S-24.
      to: S-24
  S-15:
    title: S-15
    text: |-
      Jimmie did so well at college that Saunders did not regret having sacrificed his own belated chance of study. By the time Jimmie was graduated, Saunders decided that it was not too late to carry out his own secret plan to supplement his practical knowledge of merchandising with a course in business management.

      Before he spoke of this to his mother, however, there came an excited letter from Marge, telling him that she had at last made money enough for the winter in Paris which a singer must have, and that she wanted to take her mother with her. The idea seemed ridiculous to Saunders until he learned that Marge and Mrs. Mead had planned this trip to Paris from the time Marge was a little girl.

      The plan had been an open secret among Alfred, Marge, and their mother, who were of the same temperament, but they had never mentioned it to Saunders, because they realized that he was carrying all the burden he could. Now that the heavy family expenses were over, Marge and Alfred were determined that their mother, who had been so courageous and so uncomplaining, should have a good time for once in her life. Alfred and his wife had contributed a hundred dollars in spite of the financial burden of their growing family, and when Jimmie heard of the plan, the darling had instantly handed over the twenty-five dollars with which he was about to buy himself a new suit. Could Saunders make up the rest?

      Saunders was ashamed of the way he had taken his mother for granted all these years. He reproached himself for having been so selfish that he hadn't realized that she had any desires at all beyond seeing her children well placed. Looking back, he saw that it was his mother's books of European post-cards which had given Alfred his interest in architecture, and his mother's passionate love for music that had started Marge on her career. It was true that he had furnished the money, but it was his mother's high ambitions that had inspired these two children and her belief in them that had given them the courage to persevere.

      Saunders did not have to make a decision, for it made itself. He could not, with his nature, deny his mother the pleasure that she did not ask, and over her protests he sent her abroad with Marge.

      Upon their return from Europe, it was arranged that Mrs. Mead should stay with Marge in New York, where she had the pictures and music and gaiety for which she had so long starved. She said there was no city in the world like New York. Since there was now nothing to hold Saunders in Franklin, he went to New York to live with them as soon as he could obtain a fairly good position in a department-store. He eventually became head of one of the minor departments, but did not rise to any position of power. His ambition seemed to have left him and he reproached himself that now that he had his chance he did not take advantage of it. He felt sadly that he was not the equal of his brothers and sister. Saunders never married. The thought of bringing up another family was too much for him.

      The consequence of Saunders's years of hard work for others was that Alfred, Marge, and Jimmie all had brilliant careers and his mother had her heart's desire.
    choices: []
  S-16:
    title: S-16
    text: |-
      When Saunders left Braley's store to go to Harvard for a year's study everybody was moved up one peg in accordance with the system of seniority which still obtained in the store, and Jimmie was taken in at the bottom. Jimmie hated it as much as Alfred had; but, being a more reliable lad, he settled down to work there until he could get out.

      Saunders, with a good record at the Harvard business school and years of practical experience behind him, was offered a position in Marshall Field's in Chicago. He sent for his mother and Jimmie as soon as he was established, and after the first lonesomeness was over they were all delighted with the city. Mrs. Mead had the pictures and music for which she had so long starved, and said there was no city in the world like Chicago. Later on she had a trip to Europe with Marge, and afterward remained in New York with her.

      Jimmie, who lived at home and studied railroad engineering at the University of Chicago, became self-supporting immediately after he graduated. When he left to work on a railroad in Central America, Saunders was for the first time in his life without family responsibilities. He married a college girl, a good many years younger than himself, whom he had met through Jimmie. He had always been accustomed to having younger people about, and he enjoyed the gaiety with which she and her friends surrounded him.

      The consequence of Saunders's early sacrifices for his family and his belated recognition that something was due himself, was that the others got a better start than he did but he did not entirely lose out. He married later than most men, but maybe he married more wisely.
    choices: []
  S-17:
    title: S-17
    text: |-
      Saunders put his foot down. Like a good old-fashioned husband he sternly forbade Carol's accompanying the Elwells to Bermuda, and when Carol went in hysterics to her father, Mr. Lane backed up her husband's fiat. Excitement was the breath of Carol's life. Though she loved her babies, it was not in her nature to settle down to the domestic life which her husband wanted.

      Having once adopted the stern-husband rôle, Saunders found that he must keep it up indefinitely, because Carol fell so dramatically into the complementary rôle of obedient wife. She ran to Saunders with all her minor problems. When his decision turned out to be the right one, all was well, but when it turned out wrong she bitterly blamed him and said she had known all along that he was mistaken but that there was no use arguing with him.

      She developed marvelous ability in putting her husband in the wrong, and Saunders had a continual sense of guilt for his ill treatment of her, though he couldn't see where he had made his mistakes. He was always finding out that Carol had given up innocent activities with a plaintive, "My husband wouldn't like me to." Her helpless docility appealed to all that was fatherly in Saunders, yet he was bewildered to discover that she had sometimes put through important schemes without consulting him at all, in a manner that was contrary to what he would have advised.

      The consequence was that Saunders never looked at any other woman, because what attention he could spare from earning large amounts of money to support his family was continuously occupied at home with one upheaval after another. There was a general feeling among their friends that Mead did not understand his wife, and in later years she was often spoken of as "poor Mrs. Mead."
    choices: []
  S-18:
    title: S-18
    text: |-
      Before Carol left for Bermuda, Saunders had a long talk with her. He told her that he did not agree with her father's attitude toward women; that it was all right for her father to have exacted obedience from her when she was a child but that now that she was a wife and mother she must decide things for herself. Carol was deeply touched. She said that if he would only let her go on this Bermuda trip he would see that she was worthy of his trust. At the pier she clung to him and said she would not go, because she couldn't bear to leave him. When the whistle blew she said anyhow she never would leave him again.

      Carol returned unexpectedly a week before the Elwells, and Saunders listening to a voluble account of how badly Mrs. Elwell had treated her, foresaw with satisfaction that their intimacy was ended. When the Elwells returned, however, there was trouble. Mrs. Elwell insulted Carol by ostentatiously leaving a party when Carol entered, and Carol had hysterics. The next morning Carol's father reported indignantly to Saunders that Mrs. Elwell was threatening to name Carol as co-respondent in a divorce suit.

      Saunders, going directly to Elwell to silence these outrageous rumors, learned that Mrs. Elwell had indeed started suit for divorce, had named Carol, and had ample evidence to support her accusation. Saunders was stunned. He faced Carol, who after a terrific scene, tearfully admitted her guilt, putting all the blame on Elwell. She declared with complete sincerity that she never would have gone on the trip if she had suspected for one moment that anything like this could happen. She begged Saunders to stand by her.
    choices:
    - label: The reader who thinks Saunders should insist on a divorce turns to paragraphs S-25.
      to: S-25
    - label: He who thinks Carol should not be divorced turns to paragraphs S-26.
      to: S-26
  S-19:
    title: S-19
    text: |-
      When Saunders married Helen he believed that if he were good and kind and patient enough Helen would learn to love him, but though the child soon adored his stepfather, Helen's heart was buried in Jed's grave. She was meticulous about Saunders's comfort and always tactful in her relations with him, yet the very punctiliousness with which she treated him was a barrier instead of a bond. It would have been a relief to Saunders if she had sometimes flared out at him, for then he would have known that her emotions were not dead.

      His final effort to break down the artificially harmonious relations between them occurred when he was unexpectedly summoned to New' York on a piece of business which would take only a few hours, leaving him more time than usual for recreation. He hurried home from the store in high spirits to tell Helen to pack her best dress and be off with him in the car for a week-end in the city, where he planned to give a dinner and theater party for Carol Lane, now Mrs. Leroy, and some other former Franklin people.

      To his amazement, Helen, who usually fell in with his plans, begged off, saying simply that she would rather stay at home. Saunders knew that she was fond of Carol and that the child could be safely left with his trustworthy nurse. He was utterly discouraged. He had planned the party simply to please Helen and again he had failed. Helen packed his bag cheerfully, and solicitously mended a small rip in his glove. The little boy cried when he left, but Helen seemed relieved to have her husband go, although she gave him a dutiful wifely kiss and sent affectionate messages to Carol.

      Saunders decided to give his party anyway if he could get the people together. He telephoned around after reaching New York, but found only Carol free to play with him that evening. Carol, who knew the very latest in restaurants, guided him to a small place in the fifties where, in a temple-like stillness broken only by subdued conversation, connoisseurs in food were served culinary masterpieces by waiters who had a respect for their profession.

      Saunders, who had thought that a blaring jazz palace represented the height of New York life, relaxed in the congenial atmosphere. Just as in early days he had turned to Carol when Helen was cold, so now he found consolation in her joy at seeing him again. She poured out her troubles to him. Her marriage had been a disappointment and she was even then getting a divorce with her husband's cooperation, though much against her father's wishes. She said she was desperately hard up, though Saunders would never have guessed it from the gown she wore.

      Saunders was always at his best when people were in trouble. He became so absorbed in Carol's story that they did not go to the theater but to Carol's apartment near by, on Park Avenue. Before he left they agreed to spend the following day, Sunday, motoring.

      The Sunday ride was a huge success. The weather was warm and sunny; there was a yellowish tinge in the bare willows and a glow of red in the branches of the swamp maples. They had luncheon in a darling Connecticut inn, and, as always, Carol's spirits rose and she squeezed each drop of joy from every moment. Saunders went back to Franklin happier than he had been since he married Helen. When business called him to New York again, two weeks later, he did not even suggest that Helen accompany him.

      It was not very long before he realized that Carol was willing to make up to him for his wife's coldness. They were drawn together because both had found marriage disappointing. While he felt no desire to repudiate his financial obligations to Helen, he wondered whether he was not justified in following the example of many men in situations similar to his own and seeking an ephemeral love more spontaneous than his wife's dutiful acquiescence.
    choices:
    - label: The reader who thinks that he should have a love-affair with Carol turns to paragraphs
        S-27.
      to: S-27
    - label: The one who thinks he should not do so turns to paragraphs S-28.
      to: S-28
  S-20:
    title: S-20
    text: |-
      Saunders was too intelligent to marry Helen, who did not love him, just as he had been too intelligent to marry Carol, whom he did not love; but since Helen was still the guiding star in his life, he would not marry any other woman.

      Later on he came to feel that no woman could be expected to adapt herself to his old-bachelor ways. He settled down into being disappointed in love, and found the condition not without its compensations. His brothers and sisters, and later his nieces and nephews were devoted to him, and he took a deep interest in educating them and furthering their careers. Helen's boy, who called him "Uncle," was very dear to him. He eventually took him into the store and made him junior partner, even as he himself had been given his start by Mr. Braley.

      The consequence of Saunders's having been so particular as to whom he married was that he had the joys of unclehood without the disappointments and responsibilities of fatherhood. He raised uncleing to a fine art.
    choices: []
  S-21:
    title: S-21
    text: |-
      As Mahalia's uncle—for such Saunders became by marrying her Aunt Florence—Saunders found the girl less entrancing; indeed, he grew indignant with her when he saw how greatly her irresponsibility worried her aunt. His last illusion vanished when she married a man of fifty for his money—and the man hadn't any.

      Saunders soon retired from active business and took a trip with his wife to China, where they bought some rare porcelains. As Mrs. Mead, Florence Lamont developed a latent spirit of adventure and surprised her husband by the breadth of her interests. Their house in Westchester became a center for collectors and explorers, and Saunders and his wife financed an expedition into Thibet for the study of early Asiatic pottery.

      The consequence of Saunders's having made a fortune and married a suitable wife was a few years of delightful companionship, a pleasant sense of security, and a marvelous collection of porcelains which husband and wife-agreed to will to a museum, although Mahalia argued vehemently against this waste of money.
    choices: []
  S-22:
    title: S-22
    text: |-
      It was not until he was married to Mahalia that Saunders realized how heavy and inelastic he had become during his sedentary years of moneymaking. Although he had at first, in early years, gone regularly to a gymnasium for a swim or a game of squash, pressing business had interfered so frequently with these hours of exercise that he had finally cut them out altogether. With Turkish baths and salt treatment he fought his increasing stoutness, but even those exercise substitutes he was unable to carry on systematically.

      Since he could not keep up with his young wife and the crew of youngsters who were always around her, Saunders looked forward with hope to her quieting down when the children came. But Mahalia said decisively that two children were enough, and she hired a governess for those two.

      Mahalia usually sent for her Aunt Florence to keep her husband company when she herself was going off on a chain of parties. Saunders could not really regret that he had married Mahalia, for he was devoted to the children of his old age, but he did prefer Florence to talk to. She fed his ego, while Mahalia made him feel like an old fogy.

      Florence encouraged him to go on with his porcelain collection. He was glad that he had not stopped at one million dollars but had accumulated ten, because his fortune made it possible for him to indulge this hobby without depriving his wife and children of anything they wanted.

      Prudently Saunders left the bulk of his estate in trust for his infant children, but gave his porcelain collection to his wife as part of the house furnishings, with the understanding that it was to go to a museum when she was through with it.

      The consequence of this act was that after Saunders's death, Mahalia, though she intended to carry out his wishes, being pressed for money to pay for a string of pearls that had belonged to the Empress of Russia, was obliged to sell the porcelains for a fraction of their value.
    choices: []
  S-23:
    title: S-23
    text: |-
      For the first few weeks after her marriage to Saunders, Ada was radiant with happiness and Saunders blessed the stars that had brought him such a lovely wife. But the old habit of being hurt when things went wrong was too strong to be easily broken. She felt injured when the servant gave them cold meat at lunch on wash-day, and she went to bed for two days in her distress at not being invited to a party given for Carol Lane by old Mrs. Harringdale. Saunders developed a hollow mirth in his efforts to combat his wife's depression. He was sure that if he were gentle and patient and kind enough, he could overcome her habit of unhappines.

      During her fits of depression she clung to him pathetically and could not bear to have him out of her sight. He consulted the best doctor in Franklin about her health, and when he was told that there was nothing the matter with poor Ada he felt the limitations of medical science, because there clearly was something the matter with a woman who cried all the time.

      Her one longing was to make her escape from Franklin, and Saunders realized that if she had not married him she would have been able to get away. He finally came to the conclusion that it was his duty to take her to a place where under new conditions she could form new habits of thought. Saunders being Saunders, he made the opportunity. He sold out his business on fairly good terms to the rival store, after signing an agreement not to start another store in Franklin within ten years, and bought out a small, unsuccessful mail-order business in New York, carrying out an idea which had always attracted him.

      For the first few weeks after they reached New York Ada was happy and Saunders was glad that he had taken her away from Franklin. She joined an art-school class and at first displayed great talent. Saunders was pleased that she had this interest, because it was necessary for him to give his entire attention to the development of the crippled business he had bought.

      About the time that prosperity began to come back to the business, Ada became discouraged with her slow progress at the art school; moreover, she was lonely in the evening when Saunders was shut away with his work. He tried having her stay in the room with him, but her melancholy was so distracting that he had to tell her the brutal truth—that he could not work when she was around. Nothing had ever hurt Ada like this and Saunders worked night after night with the consciousness that his wife was not sleeping but crying in bed. Yet every cent he had was in the business and for Ada's own sake he must put business before his wife.

      Two former Franklin girls, Carol Lane, now Mrs. Leroy, and Marian Cole, an enterprising young business woman, came to call and tried to draw Ada into their social circles, but their efforts came to nothing, for Ada would not go out in the evening without her husband and she didn't really think they wanted her anyhow.

      Just at the time when Saunders was able to see his way clearly ahead to a very successful future Ada gave up her work at the art school completely and began an active campaign to return to Franklin. She was desperately homesick, and she knew that she could never be happy in New York. She played her trump card when she told Saunders that there was a baby coming and that New York was no place to bring up babies. She wept so incessantly that Saunders was afraid it would be bad for the child, but when he remonstrated with her she only exclaimed hysterically that he no longer loved her. When he protested she declared that if he did love her he would take her back to Franklin. Saunders could see no chance of peace unless he acquiesced.

      As if in direct answer to his wife's prayers he had an offer for the mail-order business of almost double what he had paid for it. Ada's parents, in response to her frantic letters, had bestirred themselves in Saunders's behalf, and he was offered a position in the Franklin bank. It was not a very good one, but Saunders knew that he could work up quickly and that opportunities would open in Franklin for a man of his ability and capital. But on the other hand he liked the mail-order business and saw that there was in it a fortune that he could never make in Franklin.
    choices:
    - label: The reader who decides that Saunders should move back to Franklin turns to paragraphs
        S-29.
      to: S-29
    - label: The one who decides that he is to stay in New York turns to paragraphs S-30.
      to: S-30
  S-24:
    title: S-24
    text: |-
      Saunders tried to break off tactfully with Ada when he saw that she wanted to marry him, but he had not reckoned with the tenacity of her nature. She bombarded him with telephone calls, sent him broken-hearted little notes, and finally appealed to his mother and Marge. The effect of all this was to confirm Saunders in his opinion that Ada was not the right wife for him.

      But Ada had resources. When Saunders finally consented to go to her home for one last interview she greatly embarrassed him by going down on her knees to him and begging him to forgive her for whatever it was she had done to offend him. When he started to leave, she had violent hysterics and declared that she would kill herself. Her mother rushed in and Saunders made his escape.

      Next morning it was all over town that poor Ada had locked herself in her room and turned on the gas, and her frightened parents had had a hard time to persuade her to unlock the door. After this they sent her to make a long visit to a relative in a Western city, where she married a Spaniard, writing back to her parents that it was a case of love at first sight. Saunders sent her a beautiful wedding gift and married a darned nice, sensible, plain, intelligent girl. For a while he was jumpy whenever an impatient word or praise of another woman slipped out of his mouth, but when he found that his wife was not sensitive like Ada, he settled down to be comfortable with her and continued to be comfortable.

      The consequence was that the children brought up in this harmonious atmosphere had no nerves but much intelligence and health and joy in living. The Saunders family was a normal American family—the kind authors are always being asked to write about but can't, because the essence of drama is conflict, and there is no conflict in this sort of family.
    choices: []
  S-25:
    title: S-25
    text: |-
      The divorce was obtained in Paris with maximum expense and minimum publicity. Carol stayed abroad with the children. Saunders, who had had to leave his father-in-law's office, applied himself to building up a business of his own. Naturally a home-loving man, he was bitterly lonely. He pondered over his life and wondered where he had made his mistakes. Again and again he thought of Helen, who was now a widow, living with her one child at her mother-in-law's in Franklin.

      Saunders decided that it was time for him to go again to see his mother, who was getting old, and while he was in Franklin he took occasion to call on Helen. The change in her shocked him. She had lost her spirit and her looks. Instead of supporting herself, she had become a sycophant. She was dressed dowdily and her child behaved abominably, playing off his grandmother against his mother and demanding constant attention. There was relief all round when Saunders's call came to an end. Saunders reflected as he walked away that there were things to be said for Carol. She was never too tired to look her best and be entertaining. Her children were well brought up and adored her.

      Next year Saunders went to Paris to see his children and straighten out Carol's financial affairs, which, as usual, she had managed to get into a tangle. He spent some terrible evenings over her bank-book, which had not been balanced since they separated. He saw Carol was not one to fend for herself. She was as happy as were the children to have him there and when the four were together it was like old times.

      Saunders could not bear the thought of his lonely life in the United States and the consequence was that with some hesitation he suggested remarriage. He was surprised and delighted at Carol's gratitude. Their second marriage worked out more satisfactorily than had their first, because they were conscious of their mutual need of each other.
    choices: []
  S-26:
    title: S-26
    text: |-
      Carol's reputation was saved, partly because the Elwells had an emotional reconciliation and went abroad to live but more because people said that if there had been any truth in those rumors a man like Mr. Mead would never have forgiven his wife.

      Carol, frightened and repentant, became all wife and mother. When that palled, she took courses in poetry and psychology, dabbled a little in modeling, and began writing a novel which she never finished. She was considered a very talented woman who had given up a career for the sake of her husband and children. Saunders insisted that she and the children spend long summers in the wholesome atmosphere of Franklin, which they all loved.

      The consequence of Saunders's making the best of a poor bargain was that he worked till he had accumulated enough to retire on, bought a beautiful tract of land on the outskirts of Franklin, and built a house that was the wonder of the neighborhood. He and Carol went abroad on trips, collecting treasures for their home.
