    text: |-
      Helen had had a fear that her love and Paul's, unsanctioned by law, would crash on the disapproval of society or end in a quarrel; but neither of these things happened. United against outside disapproval, they fought the world together. The tenseness of their love never relaxed; and though they avoided monotony, yet they lost the pleasant sense of domesticity. The conflict between the love-affair, with Helen and his domestic responsibilities toward his legal wife and children was eventually too much for Paul, who broke down nervously and was sent to a sanatorium. When he was ready to come back Helen realized that he could not return to the same situation and that she must be the one to break it off. Her obvious course was to get other work so that she would not be constantly in contact with him.

      Through Nat Hebling, an author whom she had discovered and Paul had pushed to fame, she obtained a position in a publishing house. Having become accustomed to centering her affections on a lover, Helen was terribly lonely after they were parted, in spite of her large number of friends. But as the pain of separation from Paul eased in the course of months, she turned more and more to Nat and after about two years married him. Her life with Paul had not only taught her how to get on with a temperamental man but had also given her an appreciation of the ease and comfort of conventional domesticity.

      The final consequence of Helen's experimenting with illicit love was not that she became an outcast from society but that she accepted the dictates of society and settled down in a conventional marriage.
