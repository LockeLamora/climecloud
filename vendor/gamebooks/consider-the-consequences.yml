  S-27:
    title: S-27
    text: |-
      The immediate effect of Saunders's love-affair with Carol was an unexpected relaxation of the strain between him and Helen. He no longer demanded from her the warm-hearted response she was unable to give. Yet though he had given up hope of winning her love, resentment grew within him that the woman for whom he had done so much gave him so grudging a return.

      The sense of guilt which Saunders refused to recognize found its outlet in additional resentment against his wife. He was not loved by the woman he adored; he was adored—if passingly—by the woman he did not love. He did not worry about being found out, because New York was so far from Franklin and he really did have business there. Moreover, he thought that Helen would not greatly care if she did know. All she wanted from him was a home for the boy.

      When Helen did accidentally discover his unfaithfulness, he was astonished at her fury. During the scene that followed, reticence was utterly abandoned and for the first time since their marriage they spoke from the depths of their souls. Unfortunately, they spoke in anger. When Helen bitterly reproached him for deceiving her, Saunders was surprised to hear himself calling her a hard, cold woman, incapable of loving any one but her child. Helen replied that she had made it clear when she married him that she still loved Jed.

      Hope died within Saunders. He saw that she had taken refuge in her love of a dead husband, to escape committing herself to the obligations of a complete and unselfish love for a living man. In his despair he later offered her a divorce with alimony, which she accepted.

      This cataclysm destroyed Saunders's makeshift love-affair with Carol. For many years he had no interest in women, but filled up the place left vacant by the loss of Helen and her little boy by interesting himself more than ever in his younger brothers and sister. He immersed himself in work and developed a mail-order business. He eventually moved this enterprise to New York, where the undertaking was very successful.

      Saunders's habits became set and he cared little for New York social life beyond a weekly game of golf with other business men. About ten years after his divorce from Helen he married his private secretary, a plain, smartly dressed young woman who knew his ways and was willing to adapt herself to them.

      The consequence of Saunders's fairly consistent effort (with one backsliding) to do right, by both himself and his group, was that he finally made a marriage based on frankness and mutual confidence and developed a satisfying home life with a family of delightful children and an unexpectedly romantic devotion between himself and his wife.
