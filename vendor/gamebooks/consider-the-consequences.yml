  H-30:
    title: H-30
    text: |-
      When Helen bore a child out of wedlock her friends stood by her, although some thought she was a fool. The old attitude of shocked and delighted disapproval which Helen might have had to face in Franklin was entirely absent in her circle. But she had reckoned without—the tabloids. Instead of gossips, Helen faced scavengers. A reporter scented a "eugenic baby" story.

      Helen kept Paul's name out of the papers as long as she could, but he was too important a person to be hidden. The camera man photographed him entering her house. The papers despatched men to her mother's home in Franklin and dragged in her brother Simeon, now an important New York engineer. They interviewed Paul's legal wife and printed pictures of his four children. At the same time that they sobbed over the legal wife they presented Helen as a noble soul. Their lush sentimentality was worse than condemnation. They pictured her as a lascivious Madonna.

      The consequence of Helen's defiance of social conventions was not only passing humiliation but the knowledge that the story would be rehashed whenever she or Paul did any notably good work, and even years later if their child attained a position of eminence.
