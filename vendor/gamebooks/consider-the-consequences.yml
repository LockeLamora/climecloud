  H-26:
    title: H-26
    text: |-
      The year that Paul spent persuading his wife to give him a divorce was a ghastly one for Helen. She wouldn't have been able to go through with it if she had not thought that Paul's future depended upon her. For months the wife would not even listen to argument, and even after she had been persuaded to agree to a divorce, partly through the promise of excessively large alimony, she couldn't understand what it was all about. She thought she had been a good wife, because she had never been unfaithful to her husband.

      Helen and Paul were desperately poor after their marriage, despite the fact that Helen kept her office position. This made it impossible for Helen to have children, which was more of a grief to her than to Paul, who already had four. His chief regret was that he could not have his children with him for long periods, since there was no one in his new home to look after them. Helen tried not to be jealous, but it was a great strain on her to have him go so often to see his former family. Helen's affection for Paul and his for her continued, in spite of the constant annoyance of not having enough money.

      The consequence was that they accepted poverty as the price they paid for each other and it did not seem too dear to them. Helen always planned to save up enough so that she could take a year off and have a baby.
