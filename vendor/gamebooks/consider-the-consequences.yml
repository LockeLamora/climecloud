  S-28:
    title: S-28
    text: |-
      Saunders, refusing to solace his loneliness with Carol's light love, decided that romantic love was not for him and turned all of his attention to business, almost forgetting his wife's existence. Curiously enough, this had a good effect, for Helen was the type of woman who stands up bravely against life's adversities but is unhappy in a life of ease. She had defied her family in order to marry Jed, had never admitted his gradual deterioration, had refused to give up her child to the wealthy Mrs. Harringdale, and had struggled to support herself and her child when she was utterly worn out.

      Saunders had married her in great admiration for her courage, hoping to make up to her for all she had gone through, but Helen, who would have made a marvelous wife for an invalid or any husband appealing strongly to her maternal instincts, had been unable to adapt herself to being the cherished possession of a paternally minded man. She had been irked by Saunders's excess devotion. She had felt like a fly struggling in a honey-pot.

      Saunders had thought the situation at home was entirely his fault, until he had the reassuring knowledge that Carol found him lovable, reinforced by the satisfaction of having resisted temptation. This made him less of a door-mat and Helen, sensing the difference, got on better with him. She had more respect for him when he had more respect for himself.

      The consequence was that the wicked Carol had done a good deed in making love to a man unhappily married, thus giving him back his self-esteem and enabling him to hold his own against his unappreciative wife.
