      He was a blond, long, lanky, and loose-jointed. Mentally he was the type she liked—sensitive, brilliant, temperamental. When he asked her to marry him she accepted, although she knew that he would not be easy to live with. But she was prepared to accept his black moods. She had the circle of professional and artistic people that she so enjoyed while living with Marian. Gradually she took up short-story writing, and sold some of her work, although it was never her major interest. Her life as wife, mother, and woman of affairs worked out harmoniously.

      The consequence of denying herself an unpractical romance or a broken heart was the discovery that she could love a second time as heartily as the first time.
