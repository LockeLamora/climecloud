  J-4:
    title: J-4
    text: |-
      Jeb felt it was up to him to make good in his painting, for thus only could he justify himself in having refused his mother's request to return home from Paris. He had never before settled down to any kind of work, but painting did not seem to him like work. He concentrated so well that in a few years he had gained some recognition. His first triumph came when he had an Alpine landscape hung in the Salon. Its reception inspired Jed to attempt a series of European glaciers. But he was impelled to go back to America to visit his mother before he started on this life-work. For, though she had arranged her financial affairs satisfactorily by putting them in the hands of a trust company, she had never ceased to beg him to come home.

      Jed landed in New York and stayed there a few days, to visit the art galleries before going on to Franklin. He took this occasion to renew his acquaintance with Marian Cole, a former Franklin girl whom he had liked in high-school days. Marian was in fine spirits because she had just left a good position in the business office of a magazine for a far better one in the office of a railroad president.

      She told Jed that the new opening fulfilled her wildest dreams, for though she was nominally secretary, she foresaw that she would eventually be given as much responsibility as she was capable of carrying. She had known one or two women in large corporations who, though they were called secretaries, were virtually vice-presidents. Marian was not, however, too preoccupied with her own interests to have dinner with Jed every night at restaurants so smart that they were not yet widely known. She showed an intelligent appreciation of the few paintings he had brought with him and enjoyed as much as he did the art exhibitions they attended together.

      Jed remained in New York longer than he had intended. He was deeply in love with Marian and he asked her to marry him and return to Paris with him after they had visited his mother. To his bewilderment, Marian declared that though she loved him she would not give up her career for him. She could not marry him unless he would make New York his headquarters.

      Jed thought that he could easily cajole her out of these strong-minded notions, but she pointed out some three or four of her intimate friends who had both successful careers and happy home lives. She told him that though she loved him she knew that she could not be happy with a man too crystallized to adapt himself to a wife with a career.
    choices:
    - label: The reader who thinks Jed should give up Europe and marry Marian Cole turns to paragraphs
        J-9.
      to: J-9
    - label: He who thinks he should give up Marian turns to paragraphs J-10.
      to: J-10
  J-5:
    title: J-5
    text: |-
      Mrs. Harrindale, delighted at Jed's marriage to Carol, offered to build them an adorable doll's house in a birch-and-cedar grove on her estate; but Carol, after thinking it over, said that she wanted two years abroad with Jed before settling down. Jed fell in with her plans and thoroughly enjoyed being the husband of so attractive a young matron. Although it was his mother who had chosen Carol for him, it was easy for Jed to love the woman he was with. Traveling with Carol delighted him.

      They made a great many acquaintances, and were soon in full swing, migrating from Deauville to Cannes with the smart Europeans and Americans. Carol had a fortune in her own right, and Mrs. Harringdale, not to be outdone by Carol's indulgent father, made Jed a generous allowance. After two years of this gay life they found it impossible to settle down in Franklin, and though they returned now and then for a few months, they soon flitted away to the Lido, Biarritz, or some other playground.

      It was during a yachting cruise on the Mediterranean that tragedy overtook them. Guests of Price Bullen and his young wife, they left the princely Bullen yacht to spend a few days at a hotel at Antibes, where the millionaire took a half-floor of connecting rooms for his party.

      For the first time in his life Jed was genuinely, deeply, and maturely in love—with Vauncey Bullen, the convent-bred, French-English wife of his host. It was not in Jed's nature to fight against his sudden passion. His wife faded into insignificance in his life, in the glory of his new love. But Vauncey was of a different caliber. She was the strong type of woman toward whom Jed instinctively turned when left to himself and on whose strength he leaned. She refused to yield to a love-affair, although her marriage had been merely a bargain made by her father when she was too young to assert herself.

      The first evening at Antibes, Bullen asked Jed to take the two women to a concert, as he himself would have to attend to the mail he had found awaiting him. At the last moment Carol decided not to go, and Jed and Vauncey, instead of going to the concert, took the opportunity to have a long talk. On the rocks above the pounding sea, beneath a streaming summer moon, Jed pleaded for her love, but Vauncey, although she admitted that she loved Jed and that she was terribly unhappy with her domineering husband, had the notion, quaint in their set, that she was married for better or for worse. This made her sweeter and dearer than ever to Jed. From the height of love, he dropped into the depths of melancholy. He could not feel as Vauncey did the winged solace of renunciation.

      They went back to the hotel early, Vauncey going directly to her room. Jed went into the café to drink. Brooding over his drink, he seemed to see Bullen's self-satisfied, sneering face, set on a thick bullish neck, his heavy shoulders and his gross figure. Jed arose with flaming determination. It seemed to him that the gentlemanly (and dramatic) course to follow was to go like an honest man to Bullen and force him to give his wife a divorce. Had Jed been sober he would have been more sensible.

      Bullen was not in the suite sitting-room and Jed went on to his host's bedroom, which was somewhat separated from the other rooms at the farthermost end of the suite. The door was closed, and assuming that Bullen had gone to bed, Jed gave up the idea of seeing him that night and was about to go to his own room when he heard Carol's high laugh. It came from the bedroom!

      He had forgotten all about Carol. Suddenly he was poignantly aware of himself as a husband—and a wronged husband at that. Uncontrolled thoughts skidded dangerously in his drunken brain. Carol was untrue to him! That was what came of marrying a woman with a past! Although he had never really loved her, he had been true to her. He told himself that that very evening he had given up the passion of his life and this was how she repaid him! He was desperately sorry for himself. He somehow felt that it was through his nobility that he had lost both his wife and his love.

      From self-pity he passed swiftly to indignation. Untrue to him with Bullen—Bullen who stood between him and Vauncey. Light burst upon him. Bullen had tricked him! Instead of being a guileless fool who had trusted his wife to Jed, he had connived to be alone with Jed's wife! And while Jed had acted honorably, Bullen .mw-parser-output .nowrap,.mw-parser-output .nowrap a:before,.mw-parser-output .nowrap .selflink:before{white-space:nowrap}. . .

      At this unfortunate moment the door of the bedroom swung open and Carol stood on the threshold, laughing back over her shoulder at Bullen, whose amorous face changed to surprise, quickly followed by a defensive sneer as his eyes fell on Jed. Jed lunged forward, pushing Carol aside. He hardly knew what happened next. He was dimly conscious of a brief tussle from which he wrenched himself away, of Carol's quickly stifled scream, of himself standing with the neck of a broken bottle in his hand, of Bullen on the floor, his face covered with blood, of Carol grabbing the bottle-neck from him and inexplicably wiping it with a towel before she threw it on the ground and finally of being hurried silently to his room. Carol had kept her head.

      Jed had drifted into tragedy, as he had drifted into marriage and drifted into love. Bullen died two hours later without regaining consciousness. While Jed was still in a drunken stupor Carol managed things. When he came to, the search for the murderer was in full swing, but Carol's story of having been with her husband all the time had kept suspicion from falling on Jed. There was no one to contradict her statement, since Bullen had taken the precaution of sending away his personal servants and Vauncey had shut herself up in her own room when she returned.

      The decision Jed now faced was, characteristically, how to get out of trouble, not how to avoid getting into it.
    choices:
    - label: The reader who thinks he should give himself up turns to paragraphs J-11.
      to: J-11
    - label: The reader who thinks he should be silent turns to paragraphs J-12.
      to: J-12
  J-6:
    title: J-6
    text: |-
      Jed's natural tendency was toward women of force of character, and his next love-affair, a year after he had decided not to marry Carol, was with Helen Rogers, a handsome blond girl whose grave beauty was more restful to him than Carol's vivacious prettiness. Mrs. Harringdale opposed this marriage because although Helen came of a respected family, she had neither the money nor social prominence of Carol, and Mrs. Harringdale still hoped Jed would renew his inexplicably broken engagement. At one time Jed wanted Helen to elope with him, but she insisted that their marriage must be open and aboveboard.

      The two years that followed were distressing to everybody. Mrs. Harringdale would not recognize her son's engagement to Helen, except by fulminating against it. She developed high blood-pressure under the strain, and the doctors warned Jed that any undue excitement would bring on a stroke and possibly be fatal to his mother. At the end of two years Helen insisted that they must separate or marry. If he was to hold her, Jed had to choose between his mother's health and marriage with Helen. He felt deeply the truth of the old saying that a man may have many sweethearts but he has only one mother.
    choices:
    - label: The reader who decides that he is to marry Helen turns to paragraphs J-13.
      to: J-13
    - label: The reader who decides that he is to stand by his mother turns to paragraphs J-14.
      to: J-14
  J-7:
    title: J-7
    text: |-
      Jed's insolvency and death affected not only his mother but also his former wife and his daughter. Gwen and the child went home to live with Mr. Murphy and Gwen got a job in Saunders Mead's department-store. The sale of Mrs. Harringdale's personal property brought in enough for her to skimp along on, and she spent the rest of her life in cheap boarding-houses in Franklin.

      Always a hard person to live with, Mrs. Harringdale was more difficult than ever, now that she had lost the only person she loved, and was thwarted by unaccustomed poverty. She was asked to leave one boarding-house after another, until she finally found refuge in one kept by Helen Rogers, a Franklin woman, grown patient and understanding through her devotion to her own mother who had recently died.

      The consequence of Jed's amiable method of letting other people decide his problems as suited them was that he not only came to grief himself but dragged others down with him.
    choices: []
  J-8:
    title: J-8
    text: |-
      Jed's trial was short. The evidence against him was so plain that he pleaded guilty. He was convicted of arson and given a long prison sentence, of which he served only a few years. Confinement and worry broke down his health.

      But before his death in the prison hospital his mother came to him frequently and they renewed the tender relations of his early years when they had been all in all to each other. The obvious comfort which these hours gave his unhappy mother made him glad that he had resisted the temptation to commit suicide.

      The consequence of Jed's resisting the temptation to make away with himself was that he spared his mother one last pang—the grief of feeling herself responsible for her son's death.
    choices: []
  J-9:
    title: J-9
    text: |-
      Having chosen marriage to Marian in preference to life without her in Paris, Jed did not hold it up against her. With his usual adaptability he proceeded to find what he wanted in America. During a wonderful honeymoon in Canada, along the magnificent Columbia River, he discovered—that there are glaciers in America. He came back with a portfolio of striking studies of the Columbia Ice Field, from which he painted his first tremendously successful picture, the beginning of his famous series of Canadian glaciers.

      Jed's success at painting kept him from being overshadowed by his beautiful and vital young wife, but he never ceased to marvel at her cleverness. It amused him to watch the skilful way in which she arranged people's lives to their own advantage without their knowing it. Not only did she make a name for herself in the business world, but she also ran a charming home and found time to sandwich in three babies, whom she adored.

      As if this were not enough, she made friends with Jed's mother and actually persuaded his first wife Gwen, who had not remarried, to allow little Madeleine to make long visits to her father. Jed had an amused perception that his two wives were of a similar type, though Marian had the advantage of a cultural background and perhaps a more sensitive temperament. He could not quite understand why it was that she seemed to look up to him, but this was an added incentive to work at the painting which he so much enjoyed and to take the long explorative trips into Canada from which he brought back his pictures of mountain ranges, jagged against the sky, emerald lakes, and erosive cataracts dropping into dusky gorges.

      Jed was the type of a man who is ruined or saved by his wife, and the consequence of his securing a wife with an unusual combination of masculine independence and feminine tenderness was that he was cleverly guided to make the most of himself.
    choices: []
  J-10:
    title: J-10
    text: |-
      Jed, refusing to give up his artistic career in Paris for the sake of marrying Marian, settled permanently in Paris, grew a goatee, and looked so Parisian that American tourists asking directions on the street addressed him in broken French. He married into a French Huguenot family because he liked the Frenchwoman's deferential attitude toward her husband better than the independence of the American woman, and became a part of French family life. If at times its formality irked him, he could escape to discreet love-affairs without the condemnation of society.

      Occasionally he brought his wife and two children to Franklin for the summer, but he was always glad to go back to France and escape the conscientious aggressiveness of Americans, their absorption in money-making, and the nervous strain of the noisy streets. His work was good. He carried out his plan to do a series of European glaciers.

      The consequence of Jed's giving up Marian for his work was that he had his work and not Marian, though by being a little more adaptable he might have had both.
    choices: []
