  Jed:
    title: Section II — Jed
    text: |-
      Jed Harringdale was the only son of a widow. If she had been a poor widow he would have been very different—and perhaps a finer character—for he would have been expected to assume responsibility early, but she was so very rich that she took care of him too much and too long for his best good.

      Jed was fundamentally fine, but he did not have drilled into him in early youth the tiresome habits of getting to his appointments on time, knowing how much money he spent, doing things he didn't want to do because somebody else thought he ought to do them, eating what was good for him and not drinking what wasn't. In brief, he was not healthy nor wise, but he was wealthy—and a darling. To know him was to love him, and also to nag at him.

      Jed grew up in Franklin, a small New England town. He went to the high school, because it was the best school there, but took his senior year in prep school. From prep school he went to Harvard, where he had a wonderful time and got through his Freshman year by the skin of his teeth. He came back to the old home town for his summer vacation in the swaggerest clothes ever seen there and driving a racing-car which he called the Scarlet Siren. The first Sunday after his return his mother took him to church to show him off, and in the afternoon, in the consciousness of duty well done, he picked up the first acquaintance whom he met, square-shouldered Saunders Mead, a clerk in the local emporium, and the two lads started off in the Scarlet Siren in search of golden adventure.

      The car took them to Whoopee-Land, where they were just in time to pay the entrance fees for two damsels, one fair as noonday and the other black-eyed, like the dark lady of Shakspere's sonnets. (Jed had had Freshman English.) They exchanged names as they went round and round in the Ferris Wheel, they clung to each other duly in chuting the chutes, they kissed each other conventionally in the dark mill, and by that time they were well enough acquainted for the Scarlet Siren to hurry them to a road-house for food and possibly something to drink.

      Jed was a fairy prince to Gwen Murphy and she was Brunhilde to him. The strength and sureness of this uneducated young woman were restful to Jed, who was too sensitive and nervous to be husky. Jed's sophistication and slim grace were to Gwen a glimpse into another world, which she had always longed to enter. Love at first sight had come to both, and though Saunders sensibly dropped his lady love on her door-step at an early hour and prudently rang the bell before he gave her a passionate goodnight kiss, Jed drove through Arcady with Gwen all night, speeding home in a panic in order that she might get herself safely tucked into bed before her stern father got up. This was the prelude to the most wonderful summer that either of them had ever known; Jed drifted into passionate love, evading disquieting thought; Gwen, deliberately facing the facts, was willing to brave scandal and the gossip which was already arising, in order to have her love.

      Before college opened in the fall Jed had to face the first big decision of his life. Gwen told Jed that they must marry at once because she was going to have a child. Jed found that the matter did not involve simply himself and Gwen, it involved also his mother.

      Mrs. Harringdale was broken-hearted at the news. No girl in the world was good enough for Jed, and instead of the best he had, from her viewpoint, chosen the worst. She made a generous offer of money to Gwen on condition that she release Jed. She felt that Jed had been trapped by an unscrupulous woman, and at a memorable interview with the girl, during which Jed was miserable with late repentance, she accused Gwen of having deliberately schemed to get a rich husband. To which Gwen replied indignantly:

      "I certainly would never have had a love-affair with a man who couldn't marry me. What sort of a girl do you think I am?"

      Mrs. Harringdale told her, and the conversation that followed will not bear repeating.

      Jed was now faced with the choice between mother and sweetheart. When Gwen asked in astonishment, "Don't you love me any more?" he was equally astonished to find that he was unable to answer that question clearly even to himself. Up against a trouble like this, he had no time to consider whether or not he was still in love with Gwen. One cannot ask a man trapped in a burning building whether or not he loves his wife.

      It was a terrible punishment, for an hour of dalliance, to ruin his career and hurt his mother so cruelly. Yet the child was his as much as Gwen's.
    choices:
    - label: The reader who decides that Jed is to marry Gwen turns to paragraphs J-1.
      to: J-1
    - label: The one who decides that he is not to marry her turns to paragraphs J-2.
      to: J-2
  J-1:
    title: J-1
    text: |-
      For the first few weeks after their marriage Jed was very happy with Gwen. He had the approval of a satisfied conscience and he was pretty sure his mother would come around in time. He thought it was rather a lark to live with Mr. Murphy; and Mr. Murphy, who was Mrs. Harringdale's iceman, was pleased with his high-born son-in-law and amused by his unpractical schemes for making a fortune for the Murphy family. But the all-round cordiality had begun to wear a bit thin by the time the baby came.

      The baby, who had her mother's robust health and her father's sunny charm when things went well, saved the situation for a little while, but Jed and Mr. Murphy were not made to dwell in harmony together indefinitely and Jed could not make a home for Gwen and the baby. His visionary plans of ice-making on a big scale finally annoyed his father-in-law and Murphy heartily wished his daughter had married a bricklayer who would bring home his wages on Saturday night.

      Jed, who had always been the center of admiration, wilted under his first experience with criticism. He lost his greatest asset, his sunny disposition and joy in life. The Murphy family began getting on his nerves. He could not enjoy playing poker with Mr. Murphy's hearty friends, because of Mr. Murphy's habit of licking his thumb when he dealt and the awful smell of his pipe.

      Gwen was amazed that a man with all of Jed's education couldn't hold a job, and she soon came to care more for the child's sunny activity than for Jed's woebegone lolling about the house. She declared that if Jed would only make an effort he could get a job as well as anybody; but there was nothing of the go-getter in Jed's nature. He spent more and more time with his sympathetic mother, who continually pointed out to him that now that he had saved Gwen's honor, he was justified in getting a divorce.

      He was not forced to make a decision here, because the two women took matters out of his hands. Gwen bargained shrewdly with Mrs. Harringdale and obtained enough alimony to bring up the child and educate her well. She was able to move into a small house of her own with the baby, and though she bitterly regretted that Jed was not there, yet she was sensible enough to see that she wouldn't have had the house if he had been.

      Jed brooded over his failure as a husband and bread-winner until the doctors advised a long trip abroad. He went alone, for Mrs. Harringdale no longer looked upon him as a child. His marriage had shown her that he was capable of breaking with her completely, even though it involved giving up all that she could offer him.

      Jed took up sketching in Switzerland in a dilettante fashion and became so interested that he went to Paris to enter an art school, where he was looked upon as a student of decided promise but still undeveloped. He dropped easily into the life of the Latin Quarter and found there the congenial companionship he had never found in Franklin. He was becoming absorbed in his work and was receiving commendation from the masters when his mother wrote him that the family lawyer who had managed her money was dead. She concluded:

      You have been away long enough. It is now time for you to come home and relieve me of the care of the estate. My head gets quite muddled over taxes and rents. I shall turn the entire responsibility over to you. You are young, but you can learn. You can have the attic made into a studio and you can paint afternoons, but I am too old to live without you.
    choices:
    - label: The reader who thinks he should return to Franklin turns to paragraphs J-3.
      to: J-3
    - label: The reader who thinks he should stay in Paris turns to paragraphs J-4.
      to: J-4
  J-2:
    title: J-2
    text: |-
      Jed went back to college. For the first time in his life he felt dissatisfied with himself, although he had obeyed his mother and affairs had been arranged as well as possible for Gwen. She went to New York, where the child was later born in a hospital and immediately adopted by a wealthy couple, .mw-parser-output .nowrap,.mw-parser-output .nowrap a:before,.mw-parser-output .nowrap .selflink:before{white-space:nowrap}Mr. and Mrs. Edward Joralemon.

      To escape the reproaches of his conscience Jed took to drinking with the fast set, and as a result failed to pass his examinations at mid-years. His ranks were so poor that he was dropped from college. He felt himself a complete failure, but he was relieved that his mother did not take his dismissal from college seriously. Indeed, she was glad to have him under her wing again.

      Mrs. Harringdale, who now saw that her son was bound to fall in love with somebody, decided to provide him with the right girl. She arranged an Easter house-party, including Carol Lane, a New York girl who spent most of her summers in Franklin. Carol was a gay, affectionate little thing, who mistook the intensity of her shifting emotions for deep intellectuality. She was extraordinarily pretty, except in her photographs, which overlooked her enchanting blond coloring and quick changes of expression and made her look insipid. When there was a party she was on the tips of her toes. Although she had been to proms and ball games, week-end parties and yachting parties, had gone in for swimming, riding, skiing and tennis, and had migrated with the social set on their seasonal circuits even before she was a sub-deb, she had never lost her youthful enthusiasm for any kind of a good time. She brought Jed out of his blue mood in a jiffy. He felt old and mature beside her young innocence, but he realized that a man's life is different from a woman's,

      It was never hard for Jed to fall in love, and it was never hard for any man to fall in love with Carol. Their engagement was announced when the house-party ended. Jed felt it was only fair to Carol to tell her of his past, and before she left they had a heart-to-heart talk. Although he had expected that in the end she would forgive him because she must know that such things do happen in the lives of men, he was overwhelmed with gratitude at the warmth and generosity with which she assured him that she understood and did not hold his disastrous love-affair against him.

      "I'm glad that you talked so frankly to me," she said. "It makes it easier for me to tell you something I know I ought to tell you, too." Then, to Jed's horror, she told him with simple directness that she too had known the intimacies of love. It had happened the summer before, in a mad infatuation, under the combined influence of moonlight, roses, and a last cocktail.

      In agony Jed gasped: "How could you? You have ruined our love!"

      In genuine surprise Carol replied: "But you did the same thing, yourself!"

      "It's different with a man," protested Jed.

      Carol indignantly stood up for the single standard. If she forgave him, he should forgive her.
    choices:
    - label: The reader who wishes Jed to go on with the marriage turns to paragraphs J-5.
      to: J-5
    - label: The one who wishes him to break with Carol turns to paragraphs J-6.
      to: J-6
  J-3:
    title: J-3
    text: |-
      Jed dropped easily into the life of Franklin and for the first few weeks was very happy. He was glad to be again with his mother, who revived under his gay attentions, and was relieved to find that Gwen and the baby were getting on well without him. For a time he was too busy seeing his old friends to do any painting, but when the first rush of home-coming was over he had a grand time putting a north skylight in the attic and furnishing a studio that was the wonder of all Franklin. It cost more than he had expected, but now that his mother had put the control of her affairs wholly into his hands he felt that he could soon make up the difference.

      Mrs. Harringdale was an old-fashioned woman who, though she dominated in family life, was content to leave business to men. Her husband had built up their fortune, the lawyer who had just died had handled it satisfactorily, and though she had qualms about putting so much money into such inexperienced hands, yet the thought that her son would be with her outweighed her doubts. Jed took up his new duties with zest. As mortgages fell due and bonds matured he put the money into undeveloped real estate around Franklin which every one agreed would some day be valuable.

      But neither he nor his mother were willing to live on the decreased income which resulted from paying taxes on non-income-paying investments. Mrs. Harringdale complained about her lack of money, not forgetting to mention that part of the stringency was due to the heavy alimony she was paying to Jed's former wife. So Jed, who could not bear his mother's disapproval, sold some bonds and mortgages and reinvested in conservative stocks.

      Unfortunately the directors proved so very conservative that they passed their dividends, and though this course would ultimately help the stock, Jed needed money. So he sold at a loss and when Mrs. Harringdale complained, "We can't afford these conservative stocks, because we've lost so much money," he tried his hand at speculation and lost so much more that he was frightened out of the market. If the speculation had gone right Jed would have been his mother's darling son, but since it had gone wrong Mrs. Harringdale wailed loud and long and said she had never intended him to speculate.

      Jed saw that something had to be done, and since he had lost on both conservative and speculative investments, he was easily persuaded by some ambitious young men of Franklin, who needed capital, to put money into a local manufacturing enterprise which he could watch. Jed was made vice-president. His unconquerable optimism assured him that business rather than art was his line. When more capital was needed he supplied it willingly, for the concern was doing unexepectedly well and big orders were coming in. In the rosy glow of what looked like a prosperous future, Jed rebuilt the family home, whose Victorian ugliness had offended his artistic eye ever since his return from Europe. The remodeling, the new garage, and the landscape-gardening ran into more than he had expected, but the result was lovely.

      But it now developed that the spectacular increase in the business had been due to temporary conditions, and orders fell off as fast as they had increased. The expanded plant was largely idle and overhead ate up the profits—and more. Insurance premiums were disproportionately large, partly because the plant was of wooden construction and partly because Jed had insured it extravagantly. He had called this prudence, but it had really been an accommodation to a friend who was starting as an insurance agent.

      As bills for the new machinery and buildings began to come in Jed was obliged to mortgage his undeveloped real estate. A mood of black depression settled on him. He could see no way out except to put into the business every cent he could raise, hoping for another period of prosperity. A suit for patent-infringement which went against them was the last straw. Not only would they be obliged in the future to change the model of their product or pay a huge royalty, but back royalties must be paid on what they had already sold.

      Jed grew desperate. There was nothing to do but keep on, though his mother said it was only sending good money after bad. She nagged him incessantly, and the fair-weather atmosphere of love and admiration in which he had grown up changed to one of discord.

      One afternoon a creditor threatened to throw the business into bankruptcy if he were not paid the next day. That evening Jed went back to the factory to go over all his papers and make the final reckoning of the financial condition of the company and of the rest of the Harringdale estate, a duty which he had characteristically evaded, assuring himself that everything would come out all right. The final figures were much worse than he had feared. He was hopelessly insolvent.

      Jed could face bankruptcy but not his mother's reproaches. Death by his own hand seemed his only way out. He sat a long time at his desk, then pulled himself together, stood up as if he had come to a decision, put on his hat, and with shaking fingers lighted a cigarette. With a gesture of hopelessness he flung the match into the waste-paper basket, snapped out the light, and started for the door. The waste-paper flamed up unexpectedly, and Jed, startled, turned back to extinguish the flame. Half-way to the basket he stopped, struck by a thought. Insurance! One hundred thousand dollars! Enough to pull him out of the hole he was in.

      The flames leaped high as Jed walked out of the door and down the stairs, completely unaware that the night-watchman in a neighboring building had been attracted to the window by the flaming basket. In the light he had clearly seen Jed turn from the fire and walk out of the room. The watchman expected to hear an alarm as he hurried to help his neighbor and was astonished to find the door of the factory locked and to see Mr. Harringdale far down the street. By the time he himself had turned in an alarm and the fire-engine had arrived, the plant was doomed.

      The watchman, a man of unquestioned honesty, told his strange story, and the insurance company took prompt action. Jed faced arrest. He foresaw certain conviction, a long term of imprisonment and lifelong disgrace. Suicide again seemed to him the only alternative. He had a revolver in his room, and as the police rang the bell he picked it up.
