  H-20:
    title: H-20
    text: |-
      Helen's decision to take her business life seriously made her employer take her more seriously and open further opportunities to her. Within five years, not only was she allowed to have a voice in determining the policy of the magazine but to her was entrusted the delicate task of persuading well-known authors to write for the magazine what the magazine wanted. In this capacity she learned the intricacies of international copyright and made two trips to Europe to confer with English writers of note.

      Paul Merritt, the editor, was small and slight, yet in no degree effeminate. The outline of his head and face was as delicate as if it were etched. His movements were graceful and sure. His mind was quick, imaginative, and logical. It was a constant wonder to Helen that this type of man could be so intensely masculine. She learned what fun it was to work with a man who was not self-conscious about working with a woman. The fact that she was a woman was to Paul Merritt only one phase of her personality along with her keen intelligence, her warm, generous spirit, and the emotional maturity which enabled her to accept and to give criticism without hurt feelings.

      Paul appreciated this the more because his home situation was a difficult one. His wife, whom Helen soon met, wanted him to leave his chosen career to go into real estate and never ceased nagging him about making more money. She was an excellent housekeeper and devoted to her four small children over whom she worried incessantly. She had been a very pretty girl, but from the time of her marriage she had let herself go and had unfortunately not developed intelligence and good temper to take the place of the beauty she had carelessly laid aside.

      It was not until the comradeship between Paul and Helen had, to the surprise of both, developed into passionate and overwhelming love that Paul confessed to Helen his deep domestic unhappiness. He himself felt that since he had conscientiously tried for ten years to make his marriage a success he was justified in getting a divorce and finding happiness, provided he continued to support his family.

      Helen had this time not two but three courses open to her.
