    title: H-22
    text: |-
      Tired, shabby, and overworked, Helen struggled on bravely in the years following her husband's death and gradually got better positions. Young Jed, who was difficult during his early years, later on developed a protective attitude toward his mother. He refused a college education from his grandmother in order to go to work, and the old lady in her rage left her money to build a church as a memorial to her dead son. As soon as he got his working papers young Jed went into Saunders Mead's department store, and, driven by his passionate desire to make things easy for his mother, he developed actual genius in merchandising.

      By the time he was twenty-one he was making yearly trips to Paris and adding to the prosperity of the already successful store. By the time young Jed was thirty, Saunders Mead, who loved him like a son, retired, giving the management entirely to him. Jed developed a mail-order service which made the store nationally known.

      The consequence of Helen's courageous attitude toward adversity was that in her middle age she had wide interests and active habits as well as the love of her son and his family and the respect of the community.
    choices: []
  H-23:
    title: H-23
    text: |-
      Helen's voyage to China with her very pleasant missionary husband was marred by the knowledge of her mother's terrible loneliness at home. Helen had ensconced Mrs. Rogers in two sunny rooms in a boarding-house, with special attendance guaranteed, the new arrangement costing her brother Simeon no more than it had to support the two women. Mrs. Rogers would be physically as comfortable as she had been with her daughter, but Helen knew that her departure had left her mother indeed bereft.

      Helen tried conscientiously to hold this feeling of guilt in her heart, but with five lively stepchildren, two of her own later, the mission work, and a husband to whom she became more and more attached, she really didn't have the time. She sent a diary letter to her mother by every mail steamer and the Franklin missionary society took to meeting in Mrs. Rogers's sitting room once a month to hear the letters read. They voted two thirds of their annual pledges to the Montgomery Mission, and the letters, later published in book form, were widely circulated.

      The consequence was that the very people who had told Helen it was her duty to stay with her mother instead of going to China now said to Mrs. Rogers, "How fortunate you are in your daughter!"
