  S-29:
    title: S-29
    text: |-
      It was not easy for Saunders to become absorbed in bank work when he returned to Franklin because Ada wanted to leave New York. He had been uprooted from the store, in which he was tremendously interested, and uprooted again from the mail-order business just as it was becoming exciting. He loved the risks of merchandising and the triumph of winning under difficult conditions and would have gone back into the game he played so well had it not been for his agreement not to start a store in Franklin within ten years.

      Saunders gradually accepted his fate and settled again into the life of Franklin. He did not see as much of his mother as he would have liked, because Ada was jealous and upset whenever she discovered that he had been at his old home. Conservative banking was intolerably dull to him, and he relieved the tedium by a little real-estate speculation on the side, at which he was moderately successful. He took up bridge at the men's club and golf at the country-club and Ada complained with plaintive gaiety that she was a golf widow in the summer and a bridge widow in winter.

      Saunders knew that he had it in him to fill a far bigger position than he ever achieved in Franklin, and the nagging sense of unused capacities made him difficult to live with. Both Ada and the boy were glad to escape from his nervous irritability, through winters in Florida and summers in Maine.

      He was looked upon as a successful citizen, but in his heart he felt that he was a failure and was ashamed that he had weakly allowed his wife to wreck a splendid business career, and this was the consequence of being too good-natured to oppose the rule of an infantile and unreasonable person.
