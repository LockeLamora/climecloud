  S-30:
    title: S-30
    text: |-
      When Ada, for whose pleasure Saunders had left Franklin, began to campaign to return there, Saunders realized that it takes two to make a successful marriage, and that no matter how hard he tried to make his marriage go, he could not do it unless Ada coöperated. He saw that this little fragile creature, whom he had thought he could wind about his finger, had all her life used her weakness and her unhappiness as a weapon to secure her own way. He had married her for better, for worse, and he had been unfortunate enough to draw the worse.

      But Saunders had no intention of being led by the nose. He sent Ada home to her parents to stay until after the baby was born, visiting her as often as possible. By the time the baby was old enough to travel, Ada was longing to get away from Franklin again, and he settled with his little family in Montclair, New Jersey, commuting to New York.

      Ada made friends among the other young mothers and things went better, although the marriage was always far from ideal. Saunders's interest was more and more in his business, which flourished like a green bay-tree. By the time the novelty of the baby had worn off and Ada was complaining of how she was tied down, Saunders could afford an excellent nursery governess for the child and three months in a sanatorium for Ada.

      Ada was so jealous of other women that it was simpler for Saunders to keep out of social life. The consequence was that his interest centered on his son and his business. Because of the careful attention he gave both, the one was companionable and the other succeeded. Saunders was able to give Ada long sojourns in European health resorts and with equanimity bear her returns home.
