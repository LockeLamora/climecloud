      Helen's intellectual attitude toward the step that she had taken remained the same, but she was surprised to find that emotionally she reacted in the old-fashioned way. She was eaten up by jealousy of Paul's wife, and of the children whom she could not even know. He talked about the children constantly and had she been able to share them with him she would have loved them dearly. But as it was they were a menace to her hold on him. She was wild with a desire to have a child of her own, partly because of her maternal instinct and her love for Paul, but partly, she was obliged to admit to herself, because it would give her a stronger hold on him.
