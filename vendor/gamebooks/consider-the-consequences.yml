      Now at last Helen was independent. She had her child, her freedom, and an income, but she had lost what she called illusions and some people call ideals. Since life had given her so little happiness, she searched restlessly for distraction. She moved from one social resort to another, substituting a touch-and-go life of gaiety for the home life she had missed. She kept her son always with her, staying near a school in winter and traveling in summer.

      In this shifting life she met and married a tremendously wealthy man, and into the splendid life which opened out before her carried the discontent which had by this time become habitual. Her son's inheritance of his grandmother's estate brought into the family a large amount of money which was no longer needed.

      The consequences of Helen's marrying Saunders for money, giving him no return in gratitude and affection, was that she finally had the material benefits so important to her, and lacked the love and generosity which did not much interest her.
