  '349':
    text: You have covered nearly three miles when you see a group of wagons in the
      distance. They have been strung out across the highway to form a barricade.
      Soldiers in red uniforms line the roofs of the wagons and a large crowd of people
      have gathered behind them. You can hear their excited chatter echoing along
      the tunnel. As you get closer, there is a sudden silence as all eyes turn to
      stare at you. A detachment of ten soldiers, led by a knight whose shield bears
      the royal arms of Durenor, advances towards you.
