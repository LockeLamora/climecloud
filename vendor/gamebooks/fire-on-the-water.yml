      dizzy course beneath high, overhanging cliffs. A rockfall has blocked the road
      ahead and you must stop to clear it. You are helping the driver to lever a large
      rock from the path of the carriage, when you hear the sound of falling rocks.
      A boulder crashes down from the overhanging cliff, killing the driver before
      you can make any attempt to save him. He was standing less than six feet away
      from you at the time of his death.
    choices:
